   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2545" x="286.2" y="25.789004" transform="rotate(-0 286.2 25.789004)">D'une demande vague à une instruction CADRE</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(71.01293 93.609186)">« Fais-moi un rapport</text>
    <text style="font-size: 10.5px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(71.071172 110.499728)">sur l'incident d'hier. »</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Inter', 'DejaVu Sans'; fill: #b23a48" transform="translate(64.571875 170.182)">Résultat : générique, incomplet,</text>
    <text style="font-size: 8px; font-family: 'Inter', 'DejaVu Sans'; fill: #b23a48" transform="translate(55.20625 179.861687)">faits inventés pour combler les vides</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="297.36" y="67.005234" transform="rotate(-0 297.36 67.005234)">C</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="325.26" y="65.62291" transform="rotate(-0 325.26 65.62291)">Je suis responsable HSE chez MCC (mine à ciel ouvert, Cu-Co, RDC).</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="297.36" y="125.217234" transform="rotate(-0 297.36 125.217234)">A</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="325.26" y="123.83491" transform="rotate(-0 325.26 123.83491)">Rédige le rapport préliminaire d'incident à soumettre au directeur des opérations.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="297.36" y="183.429234" transform="rotate(-0 297.36 183.429234)">D</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="325.26" y="182.04691" transform="rotate(-0 325.26 182.04691)">Données : déclaration du conducteur, rapport du superviseur, photos décrites ci-dessous.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="297.36" y="241.641234" transform="rotate(-0 297.36 241.641234)">R</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(325.26 235.29807)">N'invente aucun fait ; signale « [à confirmer] » toute information manquante ;</text>
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(325.26 245.21975)">ne conclus pas sur les causes profondes avant l'enquête.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="297.36" y="299.853234" transform="rotate(-0 297.36 299.853234)">E</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.2px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="325.26" y="298.47091" transform="rotate(-0 325.26 298.47091)">Format : modèle MCC (6 rubriques), 1 page, ton factuel, liste des actions immédiates.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(56.757656 261.072519)">Résultat : un brouillon structuré,</text>
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(60.469453 274.559423)">factuel, traçable, conforme au</text>
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(69.579141 288.29664)">modèle, avec ses lacunes</text>
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(74.669766 301.726591)">explicitement signalées</text>
   </g>
  </g>
 </g>
