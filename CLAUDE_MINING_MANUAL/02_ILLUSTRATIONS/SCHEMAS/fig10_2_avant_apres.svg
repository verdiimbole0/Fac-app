   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #26313a" x="286.2" y="25.6685" transform="rotate(-0 286.2 25.6685)">D'une demande vague à une instruction CADRE</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(79.826367 94.045336)">« Fais-moi un rapport</text>
    <text style="font-size: 10.5px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(80.233242 108.839672)">sur l'incident d'hier. »</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #9e3b2f" transform="translate(75.695 168.112)">Résultat : générique, incomplet,</text>
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #9e3b2f" transform="translate(70.1275 176.112)">faits inventés pour combler les vides</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="297.36" y="66.894" transform="rotate(-0 297.36 66.894)">C</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="325.26" y="64.362" transform="rotate(-0 325.26 64.362)">Je suis responsable HSE chez MCC (mine à ciel ouvert, Cu-Co, RDC).</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="297.36" y="125.106" transform="rotate(-0 297.36 125.106)">A</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="325.26" y="122.574" transform="rotate(-0 325.26 122.574)">Rédige le rapport préliminaire d'incident à soumettre au directeur des opérations.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="297.36" y="183.318" transform="rotate(-0 297.36 183.318)">D</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="325.26" y="180.786" transform="rotate(-0 325.26 180.786)">Données : déclaration du conducteur, rapport du superviseur, photos décrites ci-dessous.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="297.36" y="241.53" transform="rotate(-0 297.36 241.53)">R</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(325.26 234.898)">N'invente aucun fait ; signale « [à confirmer] » toute information manquante ;</text>
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(325.26 243.098)">ne conclus pas sur les causes profondes avant l'enquête.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="297.36" y="299.742" transform="rotate(-0 297.36 299.742)">E</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.2px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="325.26" y="297.21" transform="rotate(-0 325.26 297.21)">Format : modèle MCC (6 rubriques), 1 page, ton factuel, liste des actions immédiates.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(67.632891 264.491859)">Résultat : un brouillon structuré,</text>
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(74.067891 275.174437)">factuel, traçable, conforme au</text>
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(83.740781 286.991859)">modèle, avec ses lacunes</text>
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(85.598438 297.5985)">explicitement signalées</text>
   </g>
  </g>
