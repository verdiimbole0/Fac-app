   <g id="text_31">
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(136.16875 182.152)">Découpage illustratif : le découpage réel dépend du « tokenizer » de chaque modèle. Les mots rares, les noms propres</text>
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(119.864375 190.152)">et les nombres sont souvent fragmentés — une des raisons pour lesquelles un LLM peut mal compter ou mal recopier un chiffre.</text>
   </g>
