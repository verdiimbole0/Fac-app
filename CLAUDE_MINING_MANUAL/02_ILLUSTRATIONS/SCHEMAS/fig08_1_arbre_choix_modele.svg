   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2545" x="286.2" y="25.789004" transform="rotate(-0 286.2 25.789004)">Arbre de décision : quel modèle pour quelle tâche ?</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="314.1" y="77.260031" transform="rotate(-0 314.1 77.260031)">Quelle est votre tâche ?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(46.519172 144.490084)">Gros volume, tâche simple,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(51.281438 156.331078)">répétitive (tri, extraction,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(47.536219 168.392666)">classement de 500 fiches)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="96.48" y="252.526812" transform="rotate(-0 96.48 252.526812)">Haiku 5.5</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #222831" x="96.48" y="292.716" transform="rotate(-0 96.48 292.716)">effort : low / medium</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(196.862344 144.444381)">Travail courant : rédiger,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(203.03775 156.271969)">résumer, analyser un</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(195.628969 168.038619)">document, échanger vite</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="241.56" y="252.360094" transform="rotate(-0 241.56 252.360094)">Sonnet 5.5</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #222831" x="241.56" y="292.716" transform="rotate(-0 241.56 292.716)">effort : medium / high</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(332.832797 144.478506)">Analyse approfondie, dossier</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(333.122859 156.250641)">complexe, rapport important,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(354.023812 168.834463)">données croisées</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="386.64" y="251.297047" transform="rotate(-0 386.64 251.297047)">Opus 5.5</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #222831" x="386.64" y="292.716" transform="rotate(-0 386.64 292.716)">effort : medium → high</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(479.483156 144.444381)">Raisonnement très exigeant,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(482.499563 156.2415)">tâche longue et autonome,</text>
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(503.065969 168.084322)">problème inédit</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="531.72" y="252.360094" transform="rotate(-0 531.72 252.360094)">Fable 5.2</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #222831" x="531.72" y="292.716" transform="rotate(-0 531.72 292.716)">effort : high (xhigh si mesuré)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(135.57 336.06207)">En cas de doute : commencez par Opus 5.5 (recommandation de la documentation Anthropic),</text>
    <text style="font-size: 8px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(151.051875 348.12043)">puis ajustez selon la qualité, la vitesse et le coût. Le choix dépend aussi de votre offre.</text>
   </g>
  </g>
