   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="314.1" y="76.013156" transform="rotate(-0 314.1 76.013156)">Quelle est votre tâche ?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(56.367891 146.004)">Gros volume, tâche simple,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(59.646328 155.754)">répétitive (tri, extraction,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(59.937 165.788578)">classement de 500 fiches)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="96.48" y="252.032672" transform="rotate(-0 96.48 252.032672)">Haiku 5.5</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #1a1a1a" x="96.48" y="292.716" transform="rotate(-0 96.48 292.716)">effort : low / medium</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(205.292438 145.9845)">Travail courant : rédiger,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(211.139391 155.754)">résumer, analyser un</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(205.297313 165.4845)">document, échanger vite</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="241.56" y="251.807516" transform="rotate(-0 241.56 251.807516)">Sonnet 5.5</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #1a1a1a" x="241.56" y="292.716" transform="rotate(-0 241.56 292.716)">effort : medium / high</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(343.868578 146.007656)">Analyse approfondie, dossier</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(342.567563 155.754)">complexe, rapport important,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(362.316188 166.5375)">données croisées</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="386.64" y="250.575172" transform="rotate(-0 386.64 250.575172)">Opus 5.5</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #1a1a1a" x="386.64" y="292.716" transform="rotate(-0 386.64 292.716)">effort : medium → high</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(489.849234 145.797422)">Raisonnement très exigeant,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(492.453703 155.7345)">tâche longue et autonome,</text>
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(507.972656 165.504)">problème inédit</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="531.72" y="252.032672" transform="rotate(-0 531.72 252.032672)">Fable 5.2</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #1a1a1a" x="531.72" y="292.716" transform="rotate(-0 531.72 292.716)">effort : high (xhigh si mesuré)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(170.7975 336.52)">En cas de doute : commencez par Opus 5.5 (recommandation de la documentation Anthropic),</text>
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(187.10125 346.515625)">puis ajustez selon la qualité, la vitesse et le coût. Le choix dépend aussi de votre offre.</text>
   </g>
