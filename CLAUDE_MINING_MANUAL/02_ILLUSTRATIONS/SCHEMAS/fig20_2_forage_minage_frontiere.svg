   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #26313a" x="286.2" y="25.314" transform="rotate(-0 286.2 25.314)">Cycle forage-minage : ce que Claude peut faire… et ce qu'il ne fait pas</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(41.5115 101.583437)">Conception</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(52.365063 117.179375)">du tir</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #ffffff" x="163.44" y="108.62825" transform="rotate(-0 163.44 108.62825)">Forage</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(241.095562 101.644625)">Chargement</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(247.415063 117.179375)">des trous</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(353.706375 102.8285)">Tir et</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(342.395625 116.972437)">sécurisation</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(448.42225 102.854625)">Contrôle</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(450.728813 115.880687)">post-tir</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(551.912 102.613312)">Retour</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #ffffff" transform="translate(542.403875 116.118562)">d'expérience</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #5a6f7e" x="163.44" y="179.064" transform="rotate(-0 163.44 179.064)">Claude peut aider à…</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(29.52 219.468)">• structurer les rapports de tir et de poste</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(29.52 227.868)">• synthétiser les mesures de vibrations validées</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(29.52 236.268)">• préparer les check-lists et causeries</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(29.52 244.668)">• analyser l'historique (fragmentation, ratés)</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(29.52 253.068)">• rédiger les retours d'expérience</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #9e3b2f" x="464.76" y="179.064" transform="rotate(-0 464.76 179.064)">Claude ne fait jamais…</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(330.84 219.468)">• concevoir ou valider un plan de tir</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(330.84 227.868)">• fixer charges, retards, distances de sécurité</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(330.84 236.268)">• autoriser un tir, lever une évacuation</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(330.84 244.668)">• gérer un raté ou un explosif non détoné</text>
    <text style="font-size: 8.4px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(330.84 253.068)">• décider des distances aux riverains</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #9e3b2f" x="18.36" y="62.64" transform="rotate(-0 18.36 62.64)">■ étapes à forte exigence de sécurité (personnes habilitées uniquement)</text>
   </g>
  </g>
 </g>
