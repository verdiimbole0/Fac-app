   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #0b2545" x="286.2" y="25.425234" transform="rotate(-0 286.2 25.425234)">Cycle forage-minage : ce que Claude peut faire… et ce qu'il ne fait pas</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(38.082937 102.817027)">Conception</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(51.850125 116.98391)">du tir</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="163.44" y="109.243562" transform="rotate(-0 163.44 109.243562)">Forage</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(237.257937 102.63209)">Chargement</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(243.781625 116.800348)">des trous</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(353.124062 103.667465)">Tir et</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(337.630562 116.977035)">sécurisation</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(446.260063 103.664715)">Contrôle</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(448.631937 116.126598)">post-tir</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(550.944688 103.490777)">Retour</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'Inter', 'DejaVu Sans'; fill: #ffffff" transform="translate(536.955438 116.126598)">d'expérience</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #13a89e" x="163.44" y="179.064" transform="rotate(-0 163.44 179.064)">Claude peut aider à…</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(29.52 217.23232)">• structurer les rapports de tir et de poste</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(29.52 227.395992)">• synthétiser les mesures de vibrations validées</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(29.52 237.559664)">• préparer les check-lists et causeries</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(29.52 247.723336)">• analyser l'historique (fragmentation, ratés)</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(29.52 257.887008)">• rédiger les retours d'expérience</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #b23a48" x="464.76" y="179.064" transform="rotate(-0 464.76 179.064)">Claude ne fait jamais…</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(330.84 217.23232)">• concevoir ou valider un plan de tir</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(330.84 227.395992)">• fixer charges, retards, distances de sécurité</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(330.84 237.559664)">• autoriser un tir, lever une évacuation</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(330.84 247.723336)">• gérer un raté ou un explosif non détoné</text>
    <text style="font-size: 8.4px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(330.84 257.887008)">• décider des distances aux riverains</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #b23a48" x="18.36" y="62.64" transform="rotate(-0 18.36 62.64)">■ étapes à forte exigence de sécurité (personnes habilitées uniquement)</text>
   </g>
  </g>
 </g>
