   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(55.863281 100.533735)">Question : « Quel article du Code minier fixe</text>
    <text style="font-size: 9px; font-family: 'Inter', 'DejaVu Sans'; fill: #222831" transform="translate(59.642578 114.350405)">le taux de redevance du cobalt ? Cite-le. »</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: middle; fill: #b23a48" x="450.81" y="57.096" transform="rotate(-0 450.81 57.096)">Réponse plausible… mais à vérifier</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(375.805883 87.676598)">« L'article 241 bis, alinéa 3, fixe le taux</text>
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(363.73457 97.719273)">à X %. Source : Journal officiel n° 14/2019. »</text>
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(450.81 107.761949)"/>
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(379.221852 117.804625)">→ numéro d'article précis, référence</text>
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(382.692289 127.847301)">officielle, ton assuré… mais rien ne</text>
    <text style="font-size: 8.3px; font-family: 'Inter', 'DejaVu Sans'" transform="translate(382.418648 137.889977)">garantit que ces éléments existent.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #0b2545" x="35.1" y="209.556" transform="rotate(-0 35.1 209.556)">Signaux d'alerte</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="40.68" y="237.276" transform="rotate(-0 40.68 237.276)">⚠  Précision excessive (numéros, dates, pages)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="308.52" y="237.276" transform="rotate(-0 308.52 237.276)">⚠  Références impossibles à retrouver</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="40.68" y="262.7784" transform="rotate(-0 40.68 262.7784)">⚠  Ton très assuré sans source fournie</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'Inter', 'DejaVu Sans'; text-anchor: start; fill: #222831" x="308.52" y="262.7784" transform="rotate(-0 308.52 262.7784)">⚠  Chiffres « ronds » ou trop parfaits</text>
