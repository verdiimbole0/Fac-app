   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #26313a" x="286.2" y="25.6685" transform="rotate(-0 286.2 25.6685)">Anatomie d'une hallucination</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(71.298281 100.313437)">Question : « Quel article du Code minier fixe</text>
    <text style="font-size: 9px; font-family: 'EB Garamond', 'DejaVu Serif'; fill: #1a1a1a" transform="translate(78.919453 112.918359)">le taux de redevance du cobalt ? Cite-le. »</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: middle; fill: #9e3b2f" x="450.81" y="57.096" transform="rotate(-0 450.81 57.096)">Réponse plausible… mais à vérifier</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(391.504555 90.757)">« L'article 241 bis, alinéa 3, fixe le taux</text>
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(381.872664 99.057)">à X %. Source : Journal officiel n° 14/2019. »</text>
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(450.81 107.357)"/>
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(393.945273 115.657)">→ numéro d'article précis, référence</text>
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(397.448781 123.957)">officielle, ton assuré… mais rien ne</text>
    <text style="font-size: 8.3px; font-family: 'EB Garamond', 'DejaVu Serif'" transform="translate(397.692594 132.257)">garantit que ces éléments existent.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #26313a" x="35.1" y="209.556" transform="rotate(-0 35.1 209.556)">Signaux d'alerte</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="40.68" y="237.276" transform="rotate(-0 40.68 237.276)">—  Précision excessive (numéros, dates, pages)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="308.52" y="237.276" transform="rotate(-0 308.52 237.276)">—  Références impossibles à retrouver</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="40.68" y="262.7784" transform="rotate(-0 40.68 262.7784)">—  Ton très assuré sans source fournie</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="308.52" y="262.7784" transform="rotate(-0 308.52 262.7784)">—  Chiffres « ronds » ou trop parfaits</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'EB Garamond', 'DejaVu Serif'; text-anchor: start; fill: #1a1a1a" x="40.68" y="288.2808" transform="rotate(-0 40.68 288.2808)">—  Contradiction avec vos propres documents</text>
   </g>
  </g>
