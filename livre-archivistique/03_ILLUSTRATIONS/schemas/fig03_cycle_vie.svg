<rect width="900" height="600" fill="white"/><circle cx="450" cy="305" r="88" fill="#0A1E3F"/><text x="450" y="287.6" font-family="Montserrat" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1.5">CYCLE DE VIE</text><text x="450" y="307.6" font-family="Montserrat" font-size="13" font-weight="800" fill="white" text-anchor="middle" letter-spacing="1.5">DU DOCUMENT</text><line x1="422" y1="321" x2="478" y2="321" stroke="#C7A34F" stroke-width="2.4"/><text x="450" y="342.1" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#C9D3E3" text-anchor="middle" letter-spacing="0" font-style="italic">traçabilité</text><text x="450" y="356.3" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#C9D3E3" text-anchor="middle" letter-spacing="0" font-style="italic">à chaque étape</text><circle cx="450.0" cy="120.0" r="54" fill="none" stroke="#C9CED8" stroke-width="20" stroke-dasharray="217.1 122.1" transform="rotate(-25.2 450.0 120.0)"/><circle cx="450.0" cy="120.0" r="42" fill="white"/><g transform="translate(450.0 120.0)" fill="none" stroke="#0A1E3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-20" y="-16" width="40" height="30" rx="2"/><path d="M-20 -16 L0 2 L20 -16"/><path d="M8 6 h18 M17 -3 v18" stroke="#C7A34F"/></g><text x="600.0" y="94.4" font-family="Montserrat" font-size="12.5" font-weight="800" fill="#0A1E3F" text-anchor="start" letter-spacing="0">1. Création ou réception</text><text x="600.0" y="113.1" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">Le document entre dans</text><text x="600.0" y="127.3" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">la sphère de l'organisation</text><line x1="516.0" y1="90.0" x2="592.0" y2="90.0" stroke="#9AA2B1" stroke-width="1.2"/><circle cx="592.0" cy="90.0" r="2.5" fill="#C7A34F"/><circle cx="625.9" cy="247.8" r="54" fill="none" stroke="#C9CED8" stroke-width="20" stroke-dasharray="217.1 122.1" transform="rotate(46.8 625.9 247.8)"/><circle cx="625.9" cy="247.8" r="42" fill="white"/><g transform="translate(625.9 247.8)" fill="none" stroke="#0A1E3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-22" width="30" height="42" rx="2"/><path d="M-10 -12h16M-10 -4h16M-10 4h10"/><path d="M10 18 l14 -22 l5 3 l-14 22 z" stroke="#C7A34F"/></g><line x1="691.9454555146034" y1="247.83185604063473" x2="717.9454555146034" y2="247.83185604063473" stroke="#9AA2B1" stroke-width="1.2"/><circle cx="717.9454555146034" cy="247.8" r="2.5" fill="#C7A34F"/><text x="731.9454555146034" y="238.2" font-family="Montserrat" font-size="12.5" font-weight="800" fill="#0A1E3F" text-anchor="start" letter-spacing="0">2. Enregistrement</text><text x="731.9454555146034" y="259.0" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">Il reçoit date, numéro</text><text x="731.9454555146034" y="273.1" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">et dossier (capture)</text><circle cx="558.7" cy="454.7" r="54" fill="none" stroke="#C9CED8" stroke-width="20" stroke-dasharray="217.1 122.1" transform="rotate(118.8 558.7 454.7)"/><circle cx="558.7" cy="454.7" r="42" fill="white"/><g transform="translate(558.7 454.7)" fill="none" stroke="#0A1E3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 -8 h36 l-8 -8 M22 8 h-36 l8 8"/><circle cx="0" cy="0" r="3" fill="#C7A34F" stroke="#C7A34F"/></g><line x1="624.7402716741076" y1="454.66814395936524" x2="650.7402716741076" y2="454.66814395936524" stroke="#9AA2B1" stroke-width="1.2"/><circle cx="650.7402716741076" cy="454.7" r="2.5" fill="#C7A34F"/><text x="664.7402716741076" y="445.0" font-family="Montserrat" font-size="12.5" font-weight="800" fill="#0A1E3F" text-anchor="start" letter-spacing="0">3. Utilisation et circulation</text><text x="664.7402716741076" y="465.8" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">Traité, validé, transmis :</text><text x="664.7402716741076" y="479.9" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="start" letter-spacing="0">un seul détenteur de l'original</text><circle cx="341.3" cy="454.7" r="54" fill="none" stroke="#C9CED8" stroke-width="20" stroke-dasharray="217.1 122.1" transform="rotate(190.8 341.3 454.7)"/><circle cx="341.3" cy="454.7" r="42" fill="white"/><g transform="translate(341.3 454.7)" fill="none" stroke="#0A1E3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="-22" y="-8" width="44" height="28" rx="2"/><path d="M-24 -16 h48 v8 h-48 z M-7 4 h14" /><rect x="-9" y="0" width="18" height="9" stroke="#C7A34F"/></g><line x1="275.2597283258925" y1="454.66814395936524" x2="249.25972832589252" y2="454.66814395936524" stroke="#9AA2B1" stroke-width="1.2"/><circle cx="249.25972832589252" cy="454.7" r="2.5" fill="#C7A34F"/><text x="235.25972832589252" y="445.0" font-family="Montserrat" font-size="12.5" font-weight="800" fill="#0A1E3F" text-anchor="end" letter-spacing="0">4. Conservation</text><text x="235.25972832589252" y="465.8" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="end" letter-spacing="0">Rangé dans son dossier,</text><text x="235.25972832589252" y="479.9" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="end" letter-spacing="0">aux conditions adaptées</text><circle cx="274.1" cy="247.8" r="54" fill="none" stroke="#C9CED8" stroke-width="20" stroke-dasharray="217.1 122.1" transform="rotate(262.8 274.1 247.8)"/><circle cx="274.1" cy="247.8" r="42" fill="white"/><g transform="translate(274.1 247.8)" fill="none" stroke="#0A1E3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -22 h28 M-14 22 h28 M-11 -22 c0 14 22 14 22 22 s-22 8 -22 22 M11 -22 c0 14 -22 14 -22 22 s22 8 22 22" transform="scale(1 0.98)"/><path d="M-5 16 h10" stroke="#C7A34F"/></g><line x1="208.0545444853966" y1="247.83185604063476" x2="182.0545444853966" y2="247.83185604063476" stroke="#9AA2B1" stroke-width="1.2"/><circle cx="182.0545444853966" cy="247.8" r="2.5" fill="#C7A34F"/><text x="168.0545444853966" y="238.2" font-family="Montserrat" font-size="12.5" font-weight="800" fill="#0A1E3F" text-anchor="end" letter-spacing="0">5. Sort final</text><text x="168.0545444853966" y="259.0" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="end" letter-spacing="0">Conservation, tri ou</text><text x="168.0545444853966" y="273.1" font-family="Source Sans 3" font-size="12" font-weight="400" fill="#1D2433" text-anchor="end" letter-spacing="0">destruction autorisée</text></svg>