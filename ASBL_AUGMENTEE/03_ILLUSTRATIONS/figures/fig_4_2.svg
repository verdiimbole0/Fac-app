<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d"><title id="t">Les cycles de fonctionnement d'une ASBL</title><desc id="d">Quatre cycles concentriques qui s'entrecroisent : cycle stratégique pluriannuel, cycle budgétaire annuel, cycle de projet, cycle mensuel de clôture et de reporting.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Quatre cycles qui s'emboîtent</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Chaque cycle produit des documents, des décisions et des échéances</text><rect x="30" y="90" width="200" height="50" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="130.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Stratégique (3–5 ans)</text><rect x="30" y="150" width="200" height="110" rx="8" fill="#F5ECD4" stroke="#102849" stroke-width="1.2"/><text x="130.0" y="197.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Vision → plan stratégique →</text><text x="130.0" y="212.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">évaluation → révision</text><rect x="245" y="90" width="200" height="50" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="345.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Budgétaire (annuel)</text><rect x="245" y="150" width="200" height="110" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="345.0" y="197.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Préparation → vote → exécution</text><text x="345.0" y="212.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">→ suivi → clôture → audit</text><rect x="460" y="90" width="200" height="50" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="560.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Projet (6 mois – 5 ans)</text><rect x="460" y="150" width="200" height="110" rx="8" fill="#D7ECE9" stroke="#102849" stroke-width="1.2"/><text x="560.0" y="197.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Identification → formulation →</text><text x="560.0" y="212.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">mise en œuvre → évaluation</text><rect x="675" y="90" width="200" height="50" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="775.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Opérationnel (mensuel)</text><rect x="675" y="150" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="775.0" y="197.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Pièces → saisie → rapprochements</text><text x="775.0" y="212.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">→ tableaux de bord → reporting</text><rect x="30" y="290" width="845" height="90" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="452.5" y="327.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Point clé pour l'IA : chaque cycle comporte des tâches répétitives (collecte, consolidation, mise en forme)</text><text x="452.5" y="342.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">et des décisions (arbitrages, validations). L'IA peut alléger les premières ; les secondes restent humaines.</text></svg>