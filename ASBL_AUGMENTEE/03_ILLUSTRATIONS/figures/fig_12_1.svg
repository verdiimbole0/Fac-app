-baseline="middle">Extraction</text><text x="350.0" y="150.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">des champs</text><line x1="409" y1="136" x2="424" y2="136" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="424" y="90" width="118" height="92" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="483.0" y="121.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">4</text><text x="483.0" y="136.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Contrôle des</text><text x="483.0" y="150.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">données extraites</text><line x1="542" y1="136" x2="557" y2="136" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="557" y="90" width="118" height="92" rx="8" fill="#D7ECE9" stroke="#167D73" stroke-width="1.2"/><text x="616.0" y="121.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">5</text><text x="616.0" y="136.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Nature de la</text><text x="616.0" y="150.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">dépense</text><line x1="6