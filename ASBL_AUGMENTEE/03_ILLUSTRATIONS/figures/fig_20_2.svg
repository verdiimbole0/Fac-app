<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d"><title id="t">Facteurs d'adoption d'un nouvel outil</title><desc id="d">Quatre déterminants inspirés des modèles d'acceptation de la technologie : utilité perçue (performance attendue), facilité d'utilisation (effort attendu), influence sociale, conditions facilitantes ; et les actions correspondantes.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Pourquoi les équipes adoptent (ou non) un outil</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Lecture pratique des modèles d'acceptation de la technologie (Davis, 1989 ; Venkatesh et al., 2003)</text><rect x="25" y="85" width="200" height="46" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="125.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Utilité perçue</text><rect x="25" y="140" width="200" height="80" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="125.0" y="172.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Cela m'aide-t-il</text><text x="125.0" y="187.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">vraiment ? »</text><rect x="25" y="235" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#167D73" stroke-width="1.2"/><text x="125.0" y="260.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Action :</text><text x="125.0" y="275.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Démontrer sur une tâche</text><text x="125.0" y="290.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">réelle de la personne</text><rect x="243" y="85" width="200" height="46" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="343.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Facilité perçue</text><rect x="243" y="140" width="200" height="80" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="343.0" y="172.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Est-ce simple</text><text x="343.0" y="187.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">pour moi ? »</text><rect x="243" y="235" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#167D73" stroke-width="1.2"/><text x="343.0" y="260.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Action :</text><text x="343.0" y="275.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Modèles prêts à l'emploi,</text><text x="343.0" y="290.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">formation courte, aide</text><rect x="461" y="85" width="200" height="46" rx="8" fill="#C7A34F" stroke="#C7A34F" stroke-width="1.2"/><text x="561.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Influence sociale</text><rect x="461" y="140" width="200" height="80" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="561.0" y="172.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Mes collègues et</text><text x="561.0" y="187.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ma hiérarchie l'utilisent-ils ? »</text><rect x="461" y="235" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#167D73" stroke-width="1.2"/><text x="561.0" y="260.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Action :</text><text x="561.0" y="275.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ambassadeurs, exemple</text><text x="561.0" y="290.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de la direction</text><rect x="679" y="85" width="200" height="46" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="779.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Conditions facilitantes</text><rect x="679" y="140" width="200" height="80" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="779.0" y="172.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Ai-je le matériel,</text><text x="779.0" y="187.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">le temps, le droit ? »</text><rect x="679" y="235" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#167D73" stroke-width="1.2"/><text x="779.0" y="260.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Action :</text><text x="779.0" y="275.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Équipement, temps dédié,</text><text x="779.0" y="290.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="normal" text-anchor="middle" dominant-baseline="middle">règles claires</text><rect x="250" y="345" width="400" height="50" rx="8" fill="#F5ECD4" stroke="#C7A34F" stroke-width="1.2"/><text x="450.0" y="370.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Intention d'utiliser → usage réel → habitudes</text></svg>