<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d"><title id="t">Le feu tricolore de classification des données</title><desc id="d">Trois catégories : vert (public, utilisable avec un outil grand public), orange (interne, utilisable avec un outil professionnel encadré, après minimisation), rouge (confidentiel ou sensible : interdit dans les outils non validés, anonymisation et validation obligatoires).</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Feu tricolore des données</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Avant chaque usage d'une IA : quelle couleur ?</text><circle cx="165" cy="110" r="30" fill="#167D73" stroke="#FFFFFF" stroke-width="3"/><rect x="30" y="155" width="270" height="40" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="165.0" y="175.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">VERT — Public</text><rect x="30" y="200" width="270" height="100" rx="8" fill="#D7ECE9" stroke="#167D73" stroke-width="1.2"/><text x="165.0" y="235.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Exemples :</text><text x="165.0" y="250.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Rapport annuel publié, article</text><text x="165.0" y="264.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de site web, appel à projets public</text><rect x="30" y="310" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#167D73" stroke-width="1.2"/><text x="165.0" y="347.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Outils grand public autorisés.</text><text x="165.0" y="362.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Vérifier les sorties.</text><circle cx="450" cy="110" r="30" fill="#D9A21B" stroke="#FFFFFF" stroke-width="3"/><rect x="315" y="155" width="270" height="40" rx="8" fill="#D9A21B" stroke="#D9A21B" stroke-width="1.2"/><text x="450.0" y="175.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ORANGE — Interne</text><rect x="315" y="200" width="270" height="100" rx="8" fill="#F5ECD4" stroke="#D9A21B" stroke-width="1.2"/><text x="450.0" y="235.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Exemples :</text><text x="450.0" y="250.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Budget non publié, procédures,</text><text x="450.0" y="264.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">PV de CA, données agrégées</text><rect x="315" y="310" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#D9A21B" stroke-width="1.2"/><text x="450.0" y="340.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Outil professionnel encadré</text><text x="450.0" y="355.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(contrat, pas d'entraînement</text><text x="450.0" y="369.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">sur vos données). Minimiser.</text><circle cx="735" cy="110" r="30" fill="#A8413A" stroke="#FFFFFF" stroke-width="3"/><rect x="600" y="155" width="270" height="40" rx="8" fill="#A8413A" stroke="#A8413A" stroke-width="1.2"/><text x="735.0" y="175.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ROUGE — Confidentiel / sensible</text><rect x="600" y="200" width="270" height="100" rx="8" fill="#F4DAD6" stroke="#A8413A" stroke-width="1.2"/><text x="735.0" y="221.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Exemples :</text><text x="735.0" y="235.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Données nominatives de</text><text x="735.0" y="250.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">bénéficiaires, santé, enfants,</text><text x="735.0" y="264.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">salaires, dossiers disciplinaires,</text><text x="735.0" y="278.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">RIB, signalements</text><rect x="600" y="310" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#A8413A" stroke-width="1.2"/><text x="735.0" y="340.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Interdit dans tout outil non</text><text x="735.0" y="355.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">validé. Anonymiser, base légale,</text><text x="735.0" y="369.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">validation du responsable.</text></svg>