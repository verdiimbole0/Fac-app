<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d"><title id="t">De l'arbre à problèmes à l'arbre à objectifs</title><desc id="d">À gauche, un arbre à problèmes : problème central « taux élevé de maladies diarrhéiques chez les enfants de moins de 5 ans », causes en bas, effets en haut. À droite, l'arbre à objectifs obtenu en reformulant chaque problème en situation positive.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="940" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Arbre à problèmes → arbre à objectifs</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Chaque cause devient un moyen ; chaque effet devient une fin</text><text x="230" y="75.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="14" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Arbre à problèmes</text><rect x="80" y="95" width="300" height="50" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="230.0" y="112.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">EFFETS : absentéisme scolaire,</text><text x="230.0" y="127.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">dépenses de santé des ménages</text><rect x="80" y="200" width="300" height="60" rx="8" fill="#A8413A" stroke="#A8413A" stroke-width="1.2"/><text x="230.0" y="215.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PROBLÈME CENTRAL :</text><text x="230.0" y="230.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">maladies diarrhéiques fréquentes</text><text x="230.0" y="245.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">chez les moins de 5 ans</text><rect x="20" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="87.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Eau de boisson</text><text x="87.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">non traitée</text><line x1="87" y1="330" x2="230" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><rect x="165" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="232.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Peu de latrines</text><text x="232.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fonctionnelles</text><line x1="232" y1="330" x2="230" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><rect x="310" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="377.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Lavage des</text><text x="377.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">mains rare</text><line x1="377" y1="330" x2="230" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><line x1="230" y1="200" x2="230" y2="145" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><text x="710" y="75.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="14" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Arbre à objectifs</text><rect x="560" y="95" width="300" height="50" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="710.0" y="112.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">FINS : assiduité scolaire accrue,</text><text x="710.0" y="127.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">dépenses de santé réduites</text><rect x="560" y="200" width="300" height="60" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="710.0" y="215.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">OBJECTIF :</text><text x="710.0" y="230.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">incidence des diarrhées</text><text x="710.0" y="245.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">réduite chez les moins de 5 ans</text><rect x="500" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="567.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Eau traitée</text><text x="567.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à domicile</text><line x1="567" y1="330" x2="710" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><rect x="645" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="712.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Latrines</text><text x="712.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fonctionnelles</text><line x1="712" y1="330" x2="710" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><rect x="790" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="857.5" y="360.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Lavage des mains</text><text x="857.5" y="374.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">aux moments clés</text><line x1="857" y1="330" x2="710" y2="260" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><line x1="710" y1="200" x2="710" y2="145" stroke="#4A5A70" stroke-width="1.2" marker-end="url(#ah4A5A70)"/><line x1="450" y1="230" x2="510" y2="230" stroke="#C7A34F" stroke-width="3" marker-end="url(#ahC7A34F)"/><text x="470" y="470.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">L'IA peut proposer des causes à discuter ; seuls les acteurs de terrain et la communauté valident l'arbre.</text></svg>