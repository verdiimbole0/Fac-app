<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d"><title id="t">De l'arbre à problèmes à l'arbre à objectifs</title><desc id="d">À gauche, un arbre à problèmes : problème central « taux élevé de maladies diarrhéiques chez les enfants de moins de 5 ans », causes en bas, effets en haut. À droite, l'arbre à objectifs obtenu en reformulant chaque problème en situation positive.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Arbre à problèmes → arbre à objectifs</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Chaque cause devient un moyen ; chaque effet devient une fin</text><text x="230" y="75.0" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Arbre à problèmes</text><rect x="80" y="95" width="300" height="50" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="230.0" y="112.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">EFFETS : absentéisme scolaire,</text><text x="230.0" y="127.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">dépenses de santé des ménages</text><rect x="80" y="200" width="300" height="60" rx="8" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><text x="230.0" y="215.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PROBLÈME CENTRAL :</text><text x="230.0" y="230.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">maladies diarrhéiques fréquentes</text><text x="230.0" y="245.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">chez les moins de 5 ans</text><rect x="20" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="87.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Eau de boisson</text><text x="87.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">non traitée</text><line x1="87" y1="330" x2="230" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><rect x="165" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="232.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Peu de latrines</text><text x="232.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fonctionnelles</text><line x1="232" y1="330" x2="230" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><rect x="310" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="377.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Lavage des</text><text x="377.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">mains rare</text><line x1="377" y1="330" x2="230" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><line x1="230" y1="200" x2="230" y2="145" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><text x="710" y="75.0" font-family="'Inter', Arial, sans-serif" font-size="14" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Arbre à objectifs</text><rect x="560" y="95" width="300" height="50" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="710.0" y="112.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">FINS : assiduité scolaire accrue,</text><text x="710.0" y="127.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">dépenses de santé réduites</text><rect x="560" y="200" width="300" height="60" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="710.0" y="215.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">OBJECTIF :</text><text x="710.0" y="230.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">incidence des diarrhées</text><text x="710.0" y="245.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">réduite chez les moins de 5 ans</text><rect x="500" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="567.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Eau traitée</text><text x="567.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à domicile</text><line x1="567" y1="330" x2="710" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><rect x="645" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="712.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Latrines</text><text x="712.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">fonctionnelles</text><line x1="712" y1="330" x2="710" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><rect x="790" y="330" width="135" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="857.5" y="360.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Lavage des mains</text><text x="857.5" y="374.4" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">aux moments clés</text><line x1="857" y1="330" x2="710" y2="260" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><line x1="710" y1="200" x2="710" y2="145" stroke="#6E6A85" stroke-width="1.2" marker-end="url(#ah6E6A85)"/><line x1="450" y1="230" x2="510" y2="230" stroke="#7B6CF0" stroke-width="3" marker-end="url(#ah7B6CF0)"/><text x="470" y="470.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">L'IA peut proposer des causes à discuter ; seuls les acteurs de terrain et la communauté valident l'arbre.</text></svg>