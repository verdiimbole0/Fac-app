<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d"><title id="t">Arbre de décision : faut-il de l'IA, une automatisation classique ou rien ?</title><desc id="d">Questions successives : le problème est-il d'abord organisationnel ? La tâche suit-elle des règles stables ? Implique-t-elle du langage, des images ou des données variables ? Une erreur est-elle grave ? Les données sont-elles disponibles et autorisées ?</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">IA, automatisation classique… ou rien ?</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Commencer par le problème, pas par l'outil</text><rect x="300" y="70" width="280" height="75" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="440.0" y="93.1" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Q1. Le problème vient-il d'abord</text><text x="440.0" y="107.5" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">d'une règle, d'un rôle ou d'une</text><text x="440.0" y="121.9" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">habitude mal définie ?</text><rect x="300" y="175" width="280" height="75" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="440.0" y="205.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Q2. La tâche suit-elle des règles</text><text x="440.0" y="219.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">stables et explicites ?</text><rect x="300" y="280" width="280" height="75" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="440.0" y="310.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Q3. Implique-t-elle du langage,</text><text x="440.0" y="324.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">des images ou des cas variables ?</text><rect x="300" y="385" width="280" height="75" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="440.0" y="408.1" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Q4. Les données nécessaires sont-</text><text x="440.0" y="422.5" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">elles disponibles, propres et</text><text x="440.0" y="436.9" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">autorisées ?</text><rect x="650" y="70" width="220" height="75" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="760.0" y="100.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Réorganiser d'abord</text><text x="760.0" y="114.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(procédure, rôles)</text><rect x="650" y="175" width="220" height="75" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="760.0" y="205.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Automatisation classique</text><text x="760.0" y="219.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(formule, règle, workflow)</text><rect x="650" y="280" width="220" height="75" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="760.0" y="310.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Outil simple / statu quo</text><text x="760.0" y="324.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(gain trop faible)</text><rect x="650" y="385" width="220" height="75" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="760.0" y="415.3" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Préparer les données</text><text x="760.0" y="429.7" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(module 7) avant l'IA</text><line x1="580" y1="107" x2="650" y2="107" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="615.0" y="98.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Oui</text><line x1="580" y1="212" x2="650" y2="212" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="615.0" y="203.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Oui</text><line x1="580" y1="317" x2="650" y2="317" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="615.0" y="308.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Non</text><line x1="580" y1="422" x2="650" y2="422" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="615.0" y="413.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Oui</text><line x1="440" y1="145" x2="440" y2="175" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="458" y="158.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Non</text><line x1="440" y1="250" x2="440" y2="280" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="458" y="263.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Non</text><line x1="440" y1="355" x2="440" y2="385" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><text x="458" y="368.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Oui</text><rect x="300" y="490" width="280" height="55" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="440.0" y="510.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Solution d'IA envisageable</text><text x="440.0" y="525.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">→ évaluer le risque d'erreur (module 8)</text><line x1="440" y1="460" x2="440" y2="490" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><text x="458" y="475.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Oui</text></svg>