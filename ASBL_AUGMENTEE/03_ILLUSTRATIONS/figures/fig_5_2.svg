<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Arbre des causes : retards de reporting financier</title><desc id="d">Le problème central « rapports financiers remis en retard » est relié à quatre familles de causes : méthodes, outils, personnes, données ; chacune détaillée en causes racines.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Remonter aux causes profondes</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Diagramme causes-effet appliqué au reporting financier</text><rect x="660" y="200" width="220" height="80" rx="8" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><text x="770.0" y="216.6" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PROBLÈME :</text><text x="770.0" y="232.2" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">rapports financiers</text><text x="770.0" y="247.8" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">remis avec 3 semaines</text><text x="770.0" y="263.4" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">de retard</text><line x1="60" y1="240" x2="660" y2="240" stroke="#241A6B" stroke-width="3"/><rect x="130" y="60" width="140" height="34" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="200.0" y="77.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">MÉTHODES</text><line x1="200" y1="94" x2="280" y2="236" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><rect x="280" y="108" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="375.0" y="126.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Pas de calendrier de clôture</text><rect x="280" y="153" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="375.0" y="164.4" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Codes budgétaires différents</text><text x="375.0" y="177.6" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">selon bailleurs</text><rect x="400" y="60" width="140" height="34" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="470.0" y="77.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">OUTILS</text><line x1="470" y1="94" x2="550" y2="236" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><rect x="550" y="108" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="645.0" y="126.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tableurs non reliés</text><rect x="550" y="153" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="645.0" y="171.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Pas de modèle de rapport</text><rect x="130" y="390" width="140" height="34" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="200.0" y="407.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PERSONNES</text><line x1="200" y1="390" x2="280" y2="244" stroke="#241A6B" stroke-width="1.4" marker-end="url(#ah241A6B)"/><rect x="280" y="283" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="375.0" y="301.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Une seule comptable</text><rect x="280" y="328" width="190" height="36" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="375.0" y="346.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Pas de suppléance formée</text><rect x="400" y="390" width="140" height="34" rx