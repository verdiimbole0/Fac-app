<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Trois niveaux d'implémentation</title><desc id="d">Escalier à trois marches : Débutant (assistant conversationnel, tableur, formulaires, procédures assistées), Intermédiaire (no-code, intégrations, gestion documentaire, assistants sur documents), Avancé (API, bases de données, ERP, RAG, agents, supervision).</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Trois niveaux d'implémentation</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">On peut commencer petit : et monter d'une marche quand les bases sont solides</text><rect x="30" y="340" width="270" height="40" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="165.0" y="360.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 1 : DÉBUTANT</text><rect x="30" y="384" width="270" height="150" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="165.0" y="417.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Assistant conversationnel · tableur</text><text x="165.0" y="431.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">formulaires numériques · modèles</text><text x="165.0" y="445.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">procédures manuelles assistées</text><text x="165.0" y="459.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="165.0" y="472.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : bureautique</text><text x="165.0" y="486.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : faibles, souvent gratuits</text><text x="165.0" y="500.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(limites des offres gratuites)</text><rect x="315" y="220" width="270" height="40" rx="8" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><text x="450.0" y="240.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 2 : INTERMÉDIAIRE</text><rect x="315" y="264" width="270" height="150" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="297.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Logiciels métier · no-code/low-code</text><text x="450.0" y="311.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">automatisations entre applications</text><text x="450.0" y="325.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">gestion documentaire · tableaux de bord</text><text x="450.0" y="339.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">assistants sur documents internes</text><text x="450.0" y="352.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="450.0" y="366.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : « référent numérique »</text><text x="450.0" y="380.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : abonnements, paramétrage</text><rect x="600" y="100" width="270" height="40" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="735.0" y="120.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 3 : AVANCÉ</text><rect x="600" y="144" width="270" height="150" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="735.0" y="177.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">API · bases de données · ERP</text><text x="735.0" y="191.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">RAG · agents IA · hébergement</text><text x="735.0" y="205.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">gestion des accès · supervision</text><text x="735.0" y="219.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="735.0" y="232.8" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : spécialistes</text><text x="735.0" y="246.5" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : développement, hébergement,</text><text x="735.0" y="260.2" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">maintenance, sécurité</text></svg>