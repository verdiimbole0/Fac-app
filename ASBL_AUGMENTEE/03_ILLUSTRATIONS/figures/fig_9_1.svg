<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Trois niveaux d'implémentation</title><desc id="d">Escalier à trois marches : Débutant (assistant conversationnel, tableur, formulaires, procédures assistées), Intermédiaire (no-code, intégrations, gestion documentaire, assistants sur documents), Avancé (API, bases de données, ERP, RAG, agents, supervision).</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Trois niveaux d'implémentation</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">On peut commencer petit — et monter d'une marche quand les bases sont solides</text><rect x="30" y="340" width="270" height="40" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="165.0" y="360.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 1 — DÉBUTANT</text><rect x="30" y="384" width="270" height="150" rx="8" fill="#D7ECE9" stroke="#102849" stroke-width="1.2"/><text x="165.0" y="417.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Assistant conversationnel · tableur</text><text x="165.0" y="431.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">formulaires numériques · modèles</text><text x="165.0" y="445.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">procédures manuelles assistées</text><text x="165.0" y="459.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="165.0" y="472.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : bureautique</text><text x="165.0" y="486.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : faibles, souvent gratuits</text><text x="165.0" y="500.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(limites des offres gratuites)</text><rect x="315" y="220" width="270" height="40" rx="8" fill="#C7A34F" stroke="#C7A34F" stroke-width="1.2"/><text x="450.0" y="240.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 2 — INTERMÉDIAIRE</text><rect x="315" y="264" width="270" height="150" rx="8" fill="#F5ECD4" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="297.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Logiciels métier · no-code/low-code</text><text x="450.0" y="311.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">automatisations entre applications</text><text x="450.0" y="325.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">gestion documentaire · tableaux de bord</text><text x="450.0" y="339.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">assistants sur documents internes</text><text x="450.0" y="352.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="450.0" y="366.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : « référent numérique »</text><text x="450.0" y="380.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : abonnements, paramétrage</text><rect x="600" y="100" width="270" height="40" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="735.0" y="120.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">NIVEAU 3 — AVANCÉ</text><rect x="600" y="144" width="270" height="150" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="735.0" y="177.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">API · bases de données · ERP</text><text x="735.0" y="191.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">RAG · agents IA · hébergement</text><text x="735.0" y="205.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">gestion des accès · supervision</text><text x="735.0" y="219.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="735.0" y="232.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Compétences : spécialistes</text><text x="735.0" y="246.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Coûts : développement, hébergement,</text><text x="735.0" y="260.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">maintenance, sécurité</text></svg>