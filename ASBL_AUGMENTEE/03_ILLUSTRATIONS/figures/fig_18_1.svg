hor="middle" dominant-baseline="middle">Cas sensibles (abus,</text><text x="450.0" y="292.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">exploitation, sécurité) :</text><text x="450.0" y="307.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">référent·e humain·e</text><text x="450.0" y="321.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">immédiatement</text></svg>