<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d"><title id="t">La boucle de redevabilité envers les communautés</title><desc id="d">Canaux multiples (ligne téléphonique, boîte à suggestions, messagerie, agents), enregistrement, classification assistée, traitement prioritaire des cas sensibles par une personne référente, réponse à la personne, analyse des tendances, ajustement du programme, retour à la communauté.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Retours, plaintes et réclamations : boucler la boucle</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Les cas sensibles sortent immédiatement du circuit automatisé</text><line x1="502.3966124859232" y1="135.36016779874845" x2="572.258762467154" y2="156.50705819707972" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="646.3587624671541" y1="210.65705819707972" x2="675.2966124859232" y2="261.71016779874844" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="675.2966124859232" y1="338.28983220125156" x2="646.3587624671541" y2="389.3429418029203" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="572.2587624671542" y1="443.4929418029203" x2="502.3966124859232" y2="464.6398322012516" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="397.6033875140768" y1="464.6398322012516" x2="327.74123753284596" y2="443.4929418029203" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="253.64123753284593" y1="389.3429418029203" x2="224.70338751407684" y2="338.28983220125156" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="224.7033875140768" y1="261.71016779874844" x2="253.6412375328459" y2="210.65705819707972" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><line x1="327.7412375328459" y1="156.50705819707972" x2="397.6033875140768" y2="135.36016779874845" stroke="#3F5BD8" stroke-width="1.8" marker-end="url(#ah3F5BD8)"/><rect x="378.0" y="89.5" width="144" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="106.4" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Canaux multiples</text><text x="450.0" y="119.5" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(voix, papier,</text><text x="450.0" y="132.6" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">messagerie, agents)</text><rect x="552.6553749530773"