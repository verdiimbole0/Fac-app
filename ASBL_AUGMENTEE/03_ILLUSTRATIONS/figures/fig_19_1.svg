<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d"><title id="t">Cycle de vie d'un projet IA dans une ASBL</title><desc id="d">Douze étapes : problème, diagnostic, cahier des charges, processus cible, sélection, budget, conception, intégration, tests, pilote, formation et déploiement, documentation ; avec deux portes de décision (go/no-go après cadrage et après pilote).</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Du problème à la solution en production</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Deux portes de décision : après le cadrage et après le pilote</text><rect x="30" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="92.5" y="122.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">1. Problème</text><line x1="155" y1="122" x2="185" y2="122" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="185" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="247.5" y="122.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">2. Diagnostic</text><line x1="310" y1="122" x2="340" y2="122" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="340" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="402.5" y="114.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">3. Cahier des</text><text x="402.5" y="129.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">charges</text><line x1="465" y1="122" x2="495" y2="122" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="495" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="557.5" y="114.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">4. Processus</text><text x="557.5" y="129.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">cible</text><line x1="620" y1="122" x2="650" y2="122" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="650" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="712.5" y="114.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">5. Sélection</text><text x="712.5" y="129.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">solution</text><line x1="775" y1="122" x2="805" y2="122" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="805" y="90" width="125" height="64" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="867.5" y="122.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">6. Budget</text><rect x="805" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="867.5" y="292.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">7. Conception</text><line x1="805" y1="292" x2="775" y2="292" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="650" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="712.5" y="292.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">8. Intégration</text><line x1="650" y1="292" x2="620" y2="292" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="495" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="557.5" y="292.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">9. Tests</text><line x1="495" y1="292" x2="465" y2="292" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="340" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="402.5" y="292.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">10. Pilote</text><line x1="340" y1="292" x2="310" y2="292" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="185" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="247.5" y="284.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">11. Formation +</text><text x="247.5" y="299.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">déploiement</text><line x1="185" y1="292" x2="155" y2="292" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="30" y="260" width="125" height="64" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="92.5" y="292.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">12. Documentation</text><line x1="867" y1="154" x2="867" y2="260" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="820" y="178" width="120" height="40" rx="8" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><text x="880.0" y="198.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">GO / NO-GO</text><rect x="250" y="345" width="130" height="40" rx="8" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><text x="315.0" y="365.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">GO / NO-GO</text><text x="480" y="410.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Un « non » après le pilote est un résultat utile : il évite d'industrialiser une mauvaise solution.</text></svg>