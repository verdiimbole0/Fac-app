<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d"><title id="t">Les grandes familles d'intelligence artificielle</title><desc id="d">Schéma emboîté : l'IA englobe les systèmes à règles et l'apprentissage automatique ; l'apprentissage automatique englobe l'apprentissage profond ; l'apprentissage profond englobe l'IA générative et les grands modèles de langage.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Les grandes familles d'IA</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Des ensembles emboîtés, pas des technologies concurrentes</text><rect x="40" y="70" width="820" height="390" rx="18" fill="#EAF0F5" stroke="#102849" stroke-width="1.5"/><text x="70" y="95.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Intelligence artificielle : tout système qui produit des prédictions, contenus, recommandations ou décisions</text><rect x="60" y="120" width="200" height="320" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="160.0" y="242.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Systèmes à règles</text><text x="160.0" y="257.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(« si… alors… »)</text><text x="160.0" y="272.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="160.0" y="287.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ex. : contrôle</text><text x="160.0" y="302.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">automatique d'un</text><text x="160.0" y="317.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">plafond de dépense</text><rect x="280" y="115" width="560" height="330" rx="16" fill="#D7ECE9" stroke="#167D73" stroke-width="1.5"/><text x="300" y="138.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#167D73" font-weight="bold" text-anchor="start" dominant-baseline="middle">Apprentissage automatique : apprend à partir d'exemples</text><text x="300" y="160.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">Ex. : prévoir un risque d'abandon scolaire</text><rect x="300" y="180" width="520" height="250" rx="14" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="320" y="202.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Apprentissage profond : réseaux de neurones à nombreuses couches</text><text x="320" y="224.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">Ex. : reconnaissance d'images, OCR moderne, voix</text><rect x="320" y="250" width="480" height="165" rx="12" fill="#F5ECD4" stroke="#C7A34F" stroke-width="1.5"/><text x="340" y="272.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12.5" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">IA générative : produit du texte, des images, du son</text><rect x="340" y="295" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="445.0" y="325.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Grands modèles</text><text x="445.0" y="340.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de langage (LLM)</text><text x="445.0" y="355.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Assistants</text><text x="445.0" y="370.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">conversationnels</text><rect x="570" y="295" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="675.0" y="340.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Modèles d'images,</text><text x="675.0" y="355.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de voix, de vidéo</text></svg>