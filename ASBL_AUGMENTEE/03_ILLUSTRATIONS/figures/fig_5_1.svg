"1.2"/><text x="365.0" y="202.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Vérifie budget</text><text x="365.0" y="217.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(Excel perso)</text><rect x="460" y="370" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="525.0" y="392.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Signe</text><text x="525.0" y="407.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(si présente)</text><rect x="620" y="275" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="685.0" y="297.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ressaisit dans</text><text x="685.0" y="312.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">le logiciel</text><rect x="780" y="275" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="845.0" y="297.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Classe la pièce</text><text x="845.0" y="312.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11