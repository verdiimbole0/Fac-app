ize="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(Excel perso)</text><rect x="460" y="370" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="525.0" y="392.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Signe</text><text x="525.0" y="407.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(si présente)</text><rect x="620" y="275" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="685.0" y="297.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ressaisit dans</text><text x="685.0" y="312.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">le logiciel</text><rect x="780" y="275" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="845.0" y="297.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Classe la pièce</text><text x="845.0" y="312.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(classeur)</text><line x1="205" y1="145" x2="300" y2="200" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="430" y1="220" x2="460" y2="380" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="590" y1="390" x2="640" y2="335" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="750" y1="305" x2="780" y2="305" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><circle cx="260" cy="95"