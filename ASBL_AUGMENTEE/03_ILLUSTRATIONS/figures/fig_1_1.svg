<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-labelledby="t d"><title id="t">Repères historiques de l'intelligence artificielle</title><desc id="d">Frise chronologique : 1950 article de Turing ; 1956 conférence de Dartmouth ; années 1980 systèmes experts ; 1997 victoire d'un ordinateur aux échecs ; 2012 essor de l'apprentissage profond ; 2017 architecture Transformer ; fin 2022 diffusion grand public des assistants conversationnels ; depuis 2024 encadrement réglementaire.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="920" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Repères historiques de l'IA</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Des promesses, des hivers, puis une accélération récente</text><line x1="40" y1="200" x2="880" y2="200" stroke="#102849" stroke-width="3"/><circle cx="70" cy="200" r="9" fill="#167D73" stroke="#FFFFFF" stroke-width="2"/><text x="70" y="228.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1950</text><rect x="18" y="250" width="104" height="76" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="70.0" y="274.9" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Turing pose la</text><text x="70.0" y="288.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">question « une machine</text><text x="70.0" y="301.1" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">peut-elle penser ? »</text><circle cx="180" cy="200" r="9" fill="#167D73" stroke="#FFFFFF" stroke-width="2"/><text x="180" y="172.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1956</text><rect x="128" y="70" width="104" height="76" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="180.0" y="94.9" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Conférence de</text><text x="180.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Dartmouth : naissance</text><text x="180.0" y="121.1" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">du terme « IA »</text><circle cx="290" cy="200" r="9" fill="#167D73" stroke="#FFFFFF" stroke-width="2"/><text x="290" y="228.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1980s</text><rect x="238" y="250" width="104" height="76" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="290.0" y="281.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Systèmes experts</text><text x="290.0" y="294.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à base de règles</text><circle cx="400" cy="200" r="9" fill="#167D73" stroke="#FFFFFF" stroke-width="2"/><text x="400" y="172.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1997</text><rect x="348" y="70" width="104" height="76" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="400.0" y="94.9" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Un ordinateur bat</text><text x="400.0" y="108.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">le champion du</text><text x="400.0" y="121.1" fo