<text x="730.0" y="301.1" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">grand public</text><circle cx="840" cy="200" r="9" fill="#7B6CF0" stroke="#FFFFFF" stroke-width="2"/><text x="840" y="172.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2024+</text><rect x="788" y="70" width="104" height="76" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="840.0" y="94.9" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Cadres et lois :</text><text x="840.0" y="108.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">AI Act, normes,</text><text x="840.0" y="121.1" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">conventions</text><text x="460" y="360.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Les « hivers de l'IA » (années 1970 et fin des années 1980) rappellent que les promesses excessives sont suivies de désillusions.</text></svg>