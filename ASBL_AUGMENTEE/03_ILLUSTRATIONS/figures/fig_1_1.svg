oke-width="2"/><text x="290" y="228.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1980s</text><rect x="238" y="250" width="104" height="76" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="290.0" y="281.4" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Systèmes experts</text><text x="290.0" y="294.6" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à base de règles</text><circle cx="400" cy="200" r="9" fill="#3F5BD8" stroke="#FFFFFF" stroke-width="2"/><text x="400" y="172.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1997</text><rect x="348" y="70" width="104" height="76" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="400.0" y="94.9" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Un ordinateur bat</text><text x="400.0" y="108.0" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">le champion du</text><text x="400.0" y="121.1" font-family="'Inter', Arial, sans-serif" font-size="10.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">monde d'échecs</text><circle cx="510" cy="200" r="9" fill="#3F5BD8" stroke="#FFFFFF" stroke-width="2"/><text x="510" y="228.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2012</text><rect x="458" y="250" width="104" height="76" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="510.0" y="274.9" font-famil