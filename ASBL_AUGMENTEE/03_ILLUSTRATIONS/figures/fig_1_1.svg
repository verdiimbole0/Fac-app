">AI Act, normes,</text><text x="840.0" y="121.1" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="10.5" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">conventions</text><text x="460" y="360.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Les « hivers de l'IA » (années 1970 et fin des années 1980) rappellent que les promesses excessives sont suivies de désillusions.</text></svg>