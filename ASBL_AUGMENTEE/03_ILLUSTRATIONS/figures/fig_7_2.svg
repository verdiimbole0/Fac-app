eline="middle">Pas d'accents, pas</text><text x="750.0" y="295.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">d'espaces, version finale</text><text x="750.0" y="310.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">= « VALIDE »</text><text x="450" y="420.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Une IA ne retrouve bien que ce qu'un humain aurait pu retrouver : le classement précède l'automatisation.</text></svg>