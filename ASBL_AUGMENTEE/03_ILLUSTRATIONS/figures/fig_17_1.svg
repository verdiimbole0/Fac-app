<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-labelledby="t d"><title id="t">La chaîne éditoriale assistée</title><desc id="d">Faits vérifiés du programme, messages clés validés, calendrier éditorial, production de déclinaisons par l'IA, relecture humaine (exactitude, consentement, dignité), publication, mesure et ajustement.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Communication : une chaîne éditoriale assistée</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">La matière première, ce sont des faits vérifiés et des consentements</text><rect x="18" y="110" width="118" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="77.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Faits vérifiés</text><text x="77.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">du programme</text><line x1="136" y1="155" x2="149" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="149" y="110" width="118" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="208.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Messages</text><text x="208.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">clés validés</text><line x1="267" y1="155" x2="280" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="280" y="110" width="118" height="90" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="339.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Calendrier</text><text x="339.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">éditorial</text><line x1="398" y1="155" x2="411" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="411" y="110" width="118" height="90" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="470.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Déclinaisons</text><text x="470.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">produites par l'IA</text><line x1="529" y1="155" x2="542" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="542" y="110" width="118" height="90" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="601.0" y="140.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Relecture :</text><text x="601.0" y="155.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">exactitude, dignité,</text><text x="601.0" y="169.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">consentement</text><line x1="660" y1="155" x2="673" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="673" y="110" width="118" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="732.0" y="155.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Publication</text><line x1="791" y1="155" x2="804" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="804" y="110" width="118" height="90" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="863.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Mesure et</text><text x="863.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ajustement</text><path d="M836,200 C836,290 77,290 77,202" fill="none" stroke="#6E6A85" stroke-width="1.3" marker-end="url(#ah6E6A85)" stroke-dasharray="5,4"/><text x="470" y="315.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Les résultats de la mesure alimentent le calendrier suivant.</text></svg>