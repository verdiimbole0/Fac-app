<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d"><title id="t">Du jeu de données au modèle, puis à la prédiction</title><desc id="d">Phase d'entraînement : données d'exemples, algorithme d'apprentissage, modèle. Phase d'utilisation : nouvelle donnée, modèle, prédiction, puis vérification humaine qui alimente l'amélioration.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Comment un système apprend</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Deux temps : l'entraînement, puis l'utilisation</text><text x="220" y="85.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#3F5BD8" font-weight="bold" text-anchor="middle" dominant-baseline="middle">1. ENTRAÎNEMENT</text><rect x="40" y="105" width="140" height="80" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="110.0" y="128.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Données</text><text x="110.0" y="145.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">d'exemples</text><text x="110.0" y="161.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(étiquetées ou non)</text><rect x="230" y="105" width="140" height="80" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="300.0" y="136.9" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Algorithme</text><text x="300.0" y="153.1" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">d'apprentissage</text><rect x="420" y="105" width="140" height="80" rx="8" fill="#E9E5FD" stroke="#7B6CF0" stroke-width="1.2"/><text x="490.0" y="128.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Modèle</text><text x="490.0" y="145.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">(paramètres</text><text x="490.0" y="161.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ajustés)</text><line x1="180" y1="145" x2="230" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="370" y1="145" x2="420" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><text x="660" y="85.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#3F5BD8" font-weight="bold" text-anchor="middle" dominant-baseline="middle">2. UTILISATION (inférence)</text><rect x="40" y="255" width="140" height="80" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="110.0" y="278.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Nouvelle donnée</text><text x="110.0" y="295.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(ex. : une facture</text><text x="110.0" y="311.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">jamais vue)</text><rect x="420" y="255" width="140" height="80" rx="8" fill="#E9E5FD" stroke="#7B6CF0" stroke-width="1.2"/><text x="490.0" y="295.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Modèle</text><rect x="610" y="255" width="120" height="80" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="670.0" y="278.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Prédiction</text><text x="670.0" y="295.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ niveau de</text><text x="670.0" y="311.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">confiance</text><rect x="770" y="255" width="110" height="80" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="825.0" y="287.2" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Vérification</text><text x="825.0" y="302.8" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">humaine</text><line x1="180" y1="295" x2="420" y2="295" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="490" y1="185" x2="490" y2="255" stroke="#7B6CF0" stroke-width="1.6" marker-end="url(#ah7B6CF0)" stroke-dasharray="5,4"/><line x1="560" y1="295" x2="610" y2="295" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="730" y1="295" x2="770" y2="295" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><path d="M825,335 C825,380 110,380 110,190" fill="none" stroke="#3F5BD8" stroke-width="1.4" marker-end="url(#ah3F5BD8)" stroke-dasharray="6,4"/><text x="470" y="372.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#3F5BD8" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Corrections et nouveaux exemples → amélioration du système</text></svg>