<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="t d"><title id="t">Matrice de priorisation valeur × faisabilité</title><desc id="d">Graphique à quatre quadrants : gains rapides (forte valeur, forte faisabilité), projets structurants (forte valeur, faible faisabilité), petites améliorations, à écarter. Huit cas d'usage positionnés.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="820" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Prioriser les cas d'usage</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Valeur pour la mission × faisabilité (données, coût, compétences, risques)</text><rect x="110" y="80" width="320.0" height="210.0" rx="0" fill="#F5ECD4" stroke="#4A5A70" stroke-width="0.8"/><rect x="430.0" y="80" width="320.0" height="210.0" rx="0" fill="#D7ECE9" stroke="#4A5A70" stroke-width="0.8"/><rect x="110" y="290.0" width="320.0" height="210.0" rx="0" fill="#F4DAD6" stroke="#4A5A70" stroke-width="0.8"/><rect x="430.0" y="290.0" width="320.0" height="210.0" rx="0" fill="#EAF0F5" stroke="#4A5A70" stroke-width="0.8"/><text x="270.0" y="98.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PROJETS STRUCTURANTS</text><text x="590.0" y="98.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#167D73" font-weight="bold" text-anchor="middle" dominant-baseline="middle">GAINS RAPIDES</text><text x="270.0" y="486.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#A8413A" font-weight="bold" text-anchor="middle" dominant-baseline="middle">À ÉCARTER / REPORTER</text><text x="590.0" y="486.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PETITES AMÉLIORATIONS</text><line x1="110" y1="500" x2="760" y2="500" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><line x1="110" y1="500" x2="110" y2="70" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><text x="430.0" y="528.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Faisabilité →</text><text x="60" y="290.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" font-weight="bold" fill="#102849" text-anchor="middle" transform="rotate(-90 60 290.0)">Valeur pour la mission →</text><circle cx="634.8" cy="164.0" r="7" fill="#102849" stroke="#FF