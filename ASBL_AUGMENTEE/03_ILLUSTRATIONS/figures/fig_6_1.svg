<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" role="img" aria-labelledby="t d"><title id="t">Matrice de priorisation valeur × faisabilité</title><desc id="d">Graphique à quatre quadrants : gains rapides (forte valeur, forte faisabilité), projets structurants (forte valeur, faible faisabilité), petites améliorations, à écarter. Huit cas d'usage positionnés.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Prioriser les cas d'usage</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Valeur pour la mission × faisabilité (données, coût, compétences, risques)</text><rect x="110" y="80" width="320.0" height="210.0" rx="0" fill="#E9E5FD" stroke="#6E6A85" stroke-width="0.8"/><rect x="430.0" y="80" width="320.0" height="210.0" rx="0" fill="#E1E9FB" stroke="#6E6A85" stroke-width="0.8"/><rect x="110" y="290.0" width="320.0" height="210.0" rx="0" fill="#F8DEDB" stroke="#6E6A85" stroke-width="0.8"/><rect x="430.0" y="290.0" width="320.0" height="210.0" rx="0" fill="#F1EFFB" stroke="#6E6A85" stroke-width="0.8"/><text x="270.0" y="98.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PROJETS STRUCTURANTS</text><text x="590.0" y="98.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#3F5BD8" font-weight="bold" text-anchor="middle" dominant-baseline="middle">GAINS RAPIDES</text><text x="270.0" y="486.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#C0392B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">À ÉCARTER / REPORTER</text><text x="590.0" y="486.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="bold" text-anchor="middle" dominant-baseline="middle">PETITES AMÉLIORATIONS</text><line x1="110" y1="500" x2="760" y2="500" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="110" y1="500" x2="110" y2="70" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><text x="430.0" y="528.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Faisabilité →</text><text x="60" y="290.0" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="bold" fill="#241A6B" text-anchor="middle" transform="rotate(-90 60 290.0)">Valeur pour la mission →</text><circle cx="634.8" cy="164.0" r="7" fill="#241A6B" stroke="#FFFFFF" stroke-width="2"/><text x="644.8" y="164.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="start" dominant-baseline="middle">1 PV de réunion</text><circle cx="590.0" cy="222.79999999999998" r="7" fill="#