<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d"><title id="t">La boucle de vérification d'une réponse d'IA</title><desc id="d">Cycle en six étapes : formuler, lire la réponse, vérifier les faits et chiffres, confronter aux sources, corriger ou reformuler, valider et documenter.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Ne jamais copier-coller sans vérifier</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">La boucle « 6 V »</text><line x1="421.22280922013925" y1="143.8" x2="486.0015094232153" y2="181.2" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><line x1="527.2243186433545" y1="252.6" x2="527.2243186433545" y2="327.4" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><line x1="486.0015094232153" y1="398.8" x2="421.22280922013925" y2="436.2" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><line x1="338.77719077986075" y1="436.2" x2="273.9984905767847" y2="398.80000000000007" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><line x1="232.77568135664546" y1="327.40000000000003" x2="232.77568135664544" y2="252.60000000000002" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><line x1="273.9984905767847" y1="181.2" x2="338.7771907798607" y2="143.8" stroke="#3F5BD8" stroke-width="2" marker-end="url(#ah3F5BD8)"/><rect x="305.0" y="90.0" width="150" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="112.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">1. Formuler</text><text x="380.0" y="127.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(CADRE)</text><rect x="452.22431864335454" y="175.0" width="150" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="527.2243186433545" y="197.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">2. Lire la réponse</text><text x="527.2243186433545" y="212.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">en entier</text><rect x="452.22431864335454" y="345.0" width="150" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="527.2243186433545" y="367.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">3. Vérifier faits,</text><text x="527.2243186433545" y="382.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">chiffres, noms</text><rect x="305.0" y="430.0" width="150" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="452.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">4. Confronter aux</text><text x="380.0" y="467.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">sources originales</text><rect x="157.77568135664546" y="345.00000000000006" width="150" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="232.77568135664546" y="367.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">5. Corriger ou</text><text x="232.77568135664546" y="382.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">reformuler</text><rect x="157.77568135664544" y="175.0" width="150" height="60" rx="8" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><text x="232.77568135664544" y="197.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">6. Valider et</text><text x="232.77568135664544" y="212.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">documenter</text><rect x="300" y="262" width="160" height="56" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="281.9" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Responsabilité</text><text x="380.0" y="298.1" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">humaine</text></svg>