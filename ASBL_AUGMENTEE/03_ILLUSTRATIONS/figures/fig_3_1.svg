<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Anatomie d'un prompt efficace : la méthode CADRE</title><desc id="d">Cinq blocs : Contexte, Action, Données, Résultat attendu, Exigences et limites. Chaque bloc est illustré par un exemple relatif à un rapport d'activité.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Méthode CADRE</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Cinq blocs pour écrire une consigne claire, vérifiable et réutilisable</text><rect x="30" y="75" width="60" height="62" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="60.0" y="106.0" font-family="'Inter', Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">C</text><rect x="100" y="75" width="230" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="215.0" y="98.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Contexte</text><text x="215.0" y="113.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Qui je suis, pour qui, dans quelle situation</text><rect x="340" y="75" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#6E6A85" stroke-width="1.2" stroke-dasharray="4,3"/><text x="605.0" y="106.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Je suis chargée de suivi-évaluation d'une ASBL de santé communautaire… »</text><rect x="30" y="151" width="60" height="62" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="60.0" y="182.0" font-family="'Inter', Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">A</text><rect x="100" y="151" width="230" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="215.0" y="174.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Action</text><text x="215.0" y="189.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ce que l'IA doit faire, avec un verbe précis</text><rect x="340" y="151" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#6E6A85" stroke-width="1.2" stroke-dasharray="4,3"/><text x="605.0" y="182.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Rédige une synthèse de 300 mots du rapport trimestriel… »</text><rect x="30" y="227" width="60" height="62" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="60.0" y="258.0" font-family="'Inter', Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">D</text><rect x="100" y="227" width="230" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="215.0" y="250.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Données</text><text x="215.0" y="265.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Les éléments fournis et leur délimitation</text><rect x="340" y="227" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#6E6A85" stroke-width="1.2" stroke-dasharray="4,3"/><text x="605.0" y="258.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« … à partir UNIQUEMENT du texte entre les balises &lt;rapport&gt;. »</text><rect x="30" y="303" width="60" height="62" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="60.0" y="334.0" font-family="'Inter', Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">R</text><rect x="100" y="303" width="230" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="215.0" y="326.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Résultat attendu</text><text x="215.0" y="341.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Format, longueur, structure, ton, langue</text><rect x="340" y="303" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#6E6A85" stroke-width="1.2" stroke-dasharray="4,3"/><text x="605.0" y="334.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Format : 3 titres, un tableau des indicateurs, ton factuel. »</text><rect x="30" y="379" width="60" height="62" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="60.0" y="410.0" font-family="'Inter', Arial, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">E</text><rect x="100" y="379" width="230" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="215.0" y="402.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Exigences et limites</text><text x="215.0" y="417.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ce qu'il ne faut pas faire ; comment signaler un doute</text><rect x="340" y="379" width="530" height="62" rx="8" fill="#FFFFFF" stroke="#6E6A85" stroke-width="1.2" stroke-dasharray="4,3"/><text x="605.0" y="410.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« N'invente aucun chiffre ; écris [À VÉRIFIER] si une donnée manque. »</text></svg>