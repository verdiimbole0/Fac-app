<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Architecture RAG (génération augmentée par la recherche)</title><desc id="d">La question de l'utilisateur déclenche une recherche dans la base documentaire de l'ASBL ; les passages pertinents sont transmis au modèle de langage avec la question ; la réponse cite ses sources et est vérifiée.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Le RAG : répondre à partir de VOS documents</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Le modèle ne « sait » pas vos procédures : on les lui fournit au moment de la question</text><rect x="30" y="110" width="150" height="70" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="105.0" y="130.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Question :</text><text x="105.0" y="145.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« Plafond d'une</text><text x="105.0" y="159.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">avance de mission ? »</text><rect x="240" y="90" width="180" height="110" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="330.0" y="128.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Moteur de recherche</text><text x="330.0" y="145.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">sémantique</text><text x="330.0" y="161.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(index des passages)</text><rect x="240" y="260" width="180" height="130" rx="8" fill="#E9E5FD" stroke="#7B6CF0" stroke-width="1.2"/><text x="330.0" y="296.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Base documentaire</text><text x="330.0" y="310.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de l'ASBL</text><text x="330.0" y="325.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Manuel de procédures</text><text x="330.0" y="339.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Politiques, conventions</text><text x="330.0" y="353.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(versions validées)</text><rect x="480" y="90" width="180" height="110" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="570.0" y="120.6" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Question</text><text x="570.0" y="136.9" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ 3 passages</text><text x="570.0" y="153.1" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">pertinents</text><text x="570.0" y="169.4" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(avec références)</text><rect x="720" y="90" width="150" height="110" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="795.0" y="136.9" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Modèle de</text><text x="795.0" y="153.1" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">langage (LLM)</text><rect x="700" y="270" width="190" height="110" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="795.0" y="303.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Réponse sourcée :</text><text x="795.0" y="317.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">« 300 UM : Manuel</text><text x="795.0" y="332.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">financier §4.2 (v3) »</text><text x="795.0" y="346.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ vérification humaine</text><line x1="180" y1="145" x2="240" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="330" y1="260" x2="330" y2="200" stroke="#7B6CF0" stroke-width="1.6" marker-end="url(#ah7B6CF0)"/><text x="380" y="230.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle">extraits</text><line x1="420" y1="145" x2="480" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="660" y1="145" x2="720" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="795" y1="200" x2="795" y2="270" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><text x="450" y="425.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Avantage : réponses fondées sur des documents à jour et vérifiables. Limite : la qualité dépend de la base (doublons, versions périmées).</text></svg>