<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d"><title id="t">Trois modes de supervision humaine</title><desc id="d">Humain dans la boucle : l'IA propose, l'humain décide à chaque fois. Humain sur la boucle : l'IA agit, l'humain surveille et peut interrompre. Humain aux commandes : l'humain fixe les règles et audite. Plus la décision est sensible, plus on va vers la gauche.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Quel niveau de supervision humaine ?</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Plus l'impact sur les personnes est fort, plus l'humain intervient tôt</text><rect x="40" y="80" width="260" height="44" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="170.0" y="102.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Humain DANS la boucle</text><rect x="40" y="130" width="260" height="170" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="170.0" y="185.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">L'IA propose,</text><text x="170.0" y="200.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">l'humain valide chaque cas.</text><text x="170.0" y="215.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="170.0" y="230.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ex. : imputation comptable,</text><text x="170.0" y="245.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">recrutement, aide sociale</text><rect x="320" y="80" width="260" height="44" rx="8" fill="#C7A34F" stroke="#C7A34F" stroke-width="1.2"/><text x="450.0" y="102.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Humain SUR la boucle</text><rect x="320" y="130" width="260" height="170" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="177.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">L'IA exécute,</text><text x="450.0" y="192.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">l'humain surveille et</text><text x="450.0" y="207.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">peut interrompre.</text><text x="450.0" y="222.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="450.0" y="237.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ex. : tri des courriels,</text><text x="450.0" y="252.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">classement documentaire</text><rect x="600" y="80" width="260" height="44" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="730.0" y="102.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Humain AUX COMMANDES</text><rect x="600" y="130" width="260" height="170" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="730.0" y="177.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">L'humain fixe les règles,</text><text x="730.0" y="192.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">les seuils et audite</text><text x="730.0" y="207.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">périodiquement.</text><text x="730.0" y="222.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle"></text><text x="730.0" y="237.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ex. : traduction de supports</text><text x="730.0" y="252.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">publics non sensibles</text><line x1="820" y1="340" x2="80" y2="340" stroke="#A8413A" stroke-width="2.5" marker-end="url(#ahA8413A)"/><text x="450" y="362.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#A8413A" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Impact croissant sur les droits, l'argent ou la sécurité des personnes</text></svg>