<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d"><title id="t">De la réunion au suivi des décisions</title><desc id="d">Flux : préparation de l'ordre du jour, réunion enregistrée avec consentement, transcription, projet de procès-verbal par l'IA, relecture par le secrétaire, adoption, registre des décisions, rappels automatiques, tableau de suivi présenté à la réunion suivante.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="940" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Gouvernance : de la réunion au suivi des décisions</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">En vert pétrole : étapes assistées par l'IA ; en bleu : étapes humaines</text><rect x="20" y="100" width="138" height="80" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="89.0" y="132.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ordre du jour</text><text x="89.0" y="147.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ documents</text><line x1="158" y1="140" x2="173" y2="140" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="173" y="100" width="138" height="80" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="242.0" y="125.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Réunion</text><text x="242.0" y="140.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">(enregistrement</text><text x="242.0" y="154.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">consenti)</text><line x1="311" y1="140" x2="326" y2="140" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="326" y="100" width="138" height="80" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="395.0" y="132.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Transcription</text><text x="395.0" y="147.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">automatique</text><line x1="464" y1="140" x2="479" y2="140" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="479" y="100" width="138" height="80" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="548.0" y="125.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Projet de PV</text><text x="548.0" y="140.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ décisions</text><text x="548.0" y="154.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">extraites</text><line x1="617" y1="140" x2="632" y2="140" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="632" y="100" width="138" height="80" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="701.0" y="125.6" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Relecture par</text><text x="701.0" y="140.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">le secrétaire</text><text x="701.0" y="154.4" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">et le président</text><line x1="770" y1="140" x2="785" y2="140" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="785" y="100" width="138" height="80" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="854.0" y="132.8" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Adoption</text><text x="854.0" y="147.2" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">du PV</text><rect x="560" y="260" width="180" height="80" rx="8" fill="#F5ECD4" stroke="#C7A34F" stroke-width="1.2"/><text x="650.0" y="292.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Registre des décisions</text><text x="650.0" y="307.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(qui, quoi, quand)</text><rect x="310" y="260" width="180" height="80" rx="8" fill="#D7ECE9" stroke="#167D73" stroke-width="1.2"/><text x="400.0" y="292.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Rappels automatiques</text><text x="400.0" y="307.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">aux responsables</text><rect x="60" y="260" width="180" height="80" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="150.0" y="292.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tableau de suivi</text><text x="150.0" y="307.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à la réunion suivante</text><line x1="840" y1="180" x2="650" y2="260" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><line x1="560" y1="300" x2="490" y2="300" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><line x1="310" y1="300" x2="240" y2="300" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><path d="M150,260 C150,215 90,215 90,182" fill="none" stroke="#4A5A70" stroke-width="1.3" marker-end="url(#ah4A5A70)" stroke-dasharray="5,4"/><text x="470" y="395.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Le PV n'a de valeur qu'une fois relu et adopté par l'organe compétent : l'IA ne produit qu'un projet.</text></svg>