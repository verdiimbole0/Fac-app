"125.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Projet de PV</text><text x="548.0" y="140.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ décisions</text><text x="548.0" y="154.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">extraites</text><line x1="617" y1="140" x2="632" y2="140" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="632" y="100" width="138" height="80" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="701.0" y="125.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Relecture par</text><text x="701.0" y="140.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">le secrétaire</text><text x="701.0" y="154.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">et le président</text><line x1="770" y1="140" x2="785" y2="140" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="785" y="100" width="138" height="80" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="854.0" y="132.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Adoption</text><text x="854.0" y="147.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">du PV</text><rect x="560" y="260" width="180" height="80" rx="8" fill="#E9E5FD" stroke="#7B6CF0" stroke-width="1.2"/><text x="650.0" y="292.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Registre des décisions</text><text x="650.0" y="307.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(qui, quoi, quand)</text><rect x="310" y="260" width="180" height="80" rx="8" fill="#E1E9FB" stroke="#3F5BD8" stroke-width="1.2"/><text x="400.0" y="292.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Rappels automatiques</text><text x="400.0" y="307.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">aux responsables</text><rect x="60" y="260" width="180" height="80" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="150.0" y="292.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tableau de suivi</text><text x="150.0" y="307.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">à la réunion suivante</text><line x1="840" y1="180" x2="650" y2="260" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="560" y1="300" x2="490" y2="300" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><line x1="310" y1="300" x2="240" y2="300" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><path d="M150,260 C150,215 90,215 90,182" fill="none" stroke="#6E6A85" stroke-width="1.3" marker-end="url(#ah6E6A85)" stroke-dasharray="5,4"/><text x="470" y="395.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Le PV n'a de valeur qu'une fois relu et adopté par l'organe compétent : l'IA ne produit qu'un projet.</text></svg>