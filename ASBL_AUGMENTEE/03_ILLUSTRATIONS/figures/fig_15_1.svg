<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Entonnoir des opportunités de financement</title><desc id="d">Veille (40 appels repérés), filtre d'éligibilité (12), adéquation stratégique (5), décision go/no-go (3), soumission (2), financement obtenu (taux variable).</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">De la veille à la soumission</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">L'IA élargit la veille et accélère l'analyse ; la direction décide du go / no-go</text><rect x="40.0" y="75" width="820" height="52" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="101.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Veille : 40 appels repérés</text><text x="870" y="101.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle"></text><rect x="120.0" y="147" width="660" height="52" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="173.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Éligibilité vérifiée : 12</text><text x="870" y="173.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle"></text><rect x="200.0" y="219" width="500" height="52" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="245.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Adéquation stratégique : 5</text><text x="710.0" y="245.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle">Grille de décision</text><rect x="270.0" y="291" width="360" height="52" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="317.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Go / No-go : 3</text><text x="640.0" y="317.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle">Direction</text><rect x="330.0" y="363" width="240" height="52" rx="8" fill="#3F5BD8" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="389.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Dossiers soumis : 2</text><text x="580.0" y="389.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle">IA : brouillons · Humain : contenu</text><text x="450" y="440.0" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Chiffres illustratifs (fictifs).</text></svg>