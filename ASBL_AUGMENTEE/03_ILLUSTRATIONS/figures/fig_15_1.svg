<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d"><title id="t">Entonnoir des opportunités de financement</title><desc id="d">Veille (40 appels repérés), filtre d'éligibilité (12), adéquation stratégique (5), décision go/no-go (3), soumission (2), financement obtenu (taux variable).</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">De la veille à la soumission</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">L'IA élargit la veille et accélère l'analyse ; la direction décide du go / no-go</text><rect x="40.0" y="75" width="820" height="52" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="101.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Veille : 40 appels repérés</text><text x="870" y="101.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle"></text><rect x="120.0" y="147" width="660" height="52" rx="8" fill="#D7ECE9" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="173.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Éligibilité vérifiée : 12</text><text x="870" y="173.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle"></text><rect x="200.0" y="219" width="500" height="52" rx="8" fill="#F5ECD4" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="245.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Adéquation stratégique : 5</text><text x="710.0" y="245.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">Grille de décision</text><rect x="270.0" y="291" width="360" height="52" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="317.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Go / No-go : 3</text><text x="640.0" y="317.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">Direction</text><rect x="330.0" y="363" width="240" height="52" rx="8" fill="#167D73" stroke="#102849" stroke-width="1.2"/><text x="450.0" y="389.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Dossiers soumis : 2</text><text x="580.0" y="389.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">IA : brouillons · Humain : contenu</text><text x="450" y="440.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11" fill="#4A5A70" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Chiffres illustratifs (fictifs).</text></svg>