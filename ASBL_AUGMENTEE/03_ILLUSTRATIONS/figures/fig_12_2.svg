<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Tableau de bord fictif : exécution budgétaire par ligne</title><desc id="d">Histogramme horizontal comparant budget et réalisé pour six lignes budgétaires d'un projet, avec taux d'exécution ; deux lignes dépassent 100 % (déplacements 118 %, communication 104 %) et une est sous-exécutée (formation 41 %). Données fictives.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Tableau de bord budgétaire — programme PRG-SANTE (données fictives)</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Budget annuel vs réalisé au 30 septembre, en milliers d'U