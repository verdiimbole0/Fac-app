<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d"><title id="t">Le cycle de vie des données</title><desc id="d">Six étapes : collecter, stocker, traiter, utiliser, partager, archiver ou détruire. Au centre : qualité, sécurité et responsabilité.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Cycle de vie des données</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Chaque étape a un responsable, une règle et un risque</text><rect x="310.0" y="85.0" width="140" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="107.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Collecter</text><text x="380.0" y="122.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(minimum utile)</text><circle cx="462.5" cy="137.10580837556762" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="452.8941916244323" y="167.5" width="140" height="60" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="522.8941916244323" y="190.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Stocker</text><text x="522.8941916244323" y="205.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(lieu sûr, accès)</text><circle cx="545.0" cy="280.0" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="452.8941916244323" y="332.5" width="140" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="522.8941916244323" y="355.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Traiter</text><text x="522.8941916244323" y="370.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(nettoyer, coder)</text><circle cx="462.5" cy="422.8941916244324" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="310.0" y="415.0" width="140" height="60" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="437.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Utiliser</text><text x="380.0" y="452.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(analyse, IA)</text><circle cx="297.50000000000006" cy="422.8941916244324" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="167.10580837556765" y="332.50000000000006" width="140" height="60" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="237.10580837556765" y="355.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Partager</text><text x="237.10580837556765" y="370.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(qui, pourquoi)</text><circle cx="215.0" cy="280.0" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="167.10580837556762" y="167.5" width="140" height="60" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="237.10580837556762" y="190.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Archiver</text><text x="237.10580837556762" y="205.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ou détruire</text><circle cx="297.49999999999994" cy="137.10580837556768" r="5" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><rect x="295" y="240" width="170" height="80" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="380.0" y="263.8" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Qualité</text><text x="380.0" y="280.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Sécurité</text><text x="380.0" y="296.2" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Responsabilité</text></svg>