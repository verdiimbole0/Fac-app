ont-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Jalons : S3 diagnostic validé · S5 politique adoptée · S11 bilan des pilotes · S13 décision du conseil.</text></svg>