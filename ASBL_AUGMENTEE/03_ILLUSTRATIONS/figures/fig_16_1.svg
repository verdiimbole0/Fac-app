<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d"><title id="t">Circuit achats et logistique</title><desc id="d">Demande d'achat, vérification budgétaire, consultation, tableau comparatif des offres, décision du comité, bon de commande, réception et rapprochement à trois voies (commande, bon de livraison, facture), stock et inventaire, immobilisations.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Circuit achats : de la demande à l'inventaire</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Séparation des tâches : demander ≠ choisir ≠ réceptionner ≠ payer</text><rect x="18" y="110" width="104" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="70.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Demande</text><text x="70.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">d'achat</text><line x1="122" y1="155" x2="133" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="133" y="110" width="104" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="185.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Contrôle</text><text x="185.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">budgétaire</text><line x1="237" y1="155" x2="248" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="248" y="110" width="104" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="300.0" y="140.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Consultation</text><text x="300.0" y="155.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">(≥ 3 offres</text><text x="300.0" y="169.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">selon seuil)</text><line x1="352" y1="155" x2="363" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="363" y="110" width="104" height="90" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="415.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tableau</text><text x="415.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">comparatif</text><line x1="467" y1="155" x2="478" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="478" y="110" width="104" height="90" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="530.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Décision</text><text x="530.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">(comité)</text><line x1="582" y1="155" x2="593" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="593" y="110" width="104" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="645.0" y="147.8" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Bon de</text><text x="645.0" y="162.2" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">commande</text><line x1="697" y1="155" x2="708" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="708" y="110" width="104" height="90" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="760.0" y="140.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Réception</text><text x="760.0" y="155.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">+ rapprochement</text><text x="760.0" y="169.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="middle">3 voies</text><line x1="812" y1="155" x2="823" y2="155" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="823" y="110" width="104" height="90" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="875.0" y="140.6" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Stock /</text><text x="875.0" y="155.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">inventaire /</text><text x="875.0" y="169.4" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">immobilisations</text><rect x="120" y="260" width="700" height="90" rx="8" fill="#E9E5FD" stroke="#7B6CF0" stroke-width="1.2"/><text x="470.0" y="290.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Où l'IA aide : extraire les offres reçues (PDF, photos) dans un tableau normalisé ; signaler les écarts</text><text x="470.0" y="305.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">entre commande, bon de livraison et facture ; proposer des alertes de réapprovisionnement.</text><text x="470.0" y="320.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Où elle n'intervient pas : le choix du fournisseur et la réception physique.</text></svg>