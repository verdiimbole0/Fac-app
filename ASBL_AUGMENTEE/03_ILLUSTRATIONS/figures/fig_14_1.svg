<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d"><title id="t">Recrutement assisté : où l'IA aide, où l'humain décide</title><desc id="d">Étapes : besoin, fiche de poste (IA assiste), annonce (IA assiste), réception des candidatures (logiciel), présélection selon grille humaine, entretiens, décision et retour aux candidats. Le tri automatique sans contrôle humain est barré.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Recrutement : l'IA prépare, l'humain évalue et décide</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Aucune décision sur une personne n'est déléguée à une machine</text><rect x="20" y="110" width="118" height="70" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="79.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Besoin</text><text x="79.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">validé</text><line x1="138" y1="145" x2="151" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="151" y="110" width="118" height="70" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="210.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Fiche de</text><text x="210.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">poste</text><line x1="269" y1="145" x2="282" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="282" y="110" width="118" height="70" rx="8" fill="#3F5BD8" stroke="#3F5BD8" stroke-width="1.2"/><text x="341.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Annonce</text><text x="341.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">inclusive</text><line x1="400" y1="145" x2="413" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="413" y="110" width="118" height="70" rx="8" fill="#7B6CF0" stroke="#7B6CF0" stroke-width="1.2"/><text x="472.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Réception</text><text x="472.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">candidatures</text><line x1="531" y1="145" x2="544" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="544" y="110" width="118" height="70" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="603.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Présélection</text><text x="603.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">sur grille</text><line x1="662" y1="145" x2="675" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="675" y="110" width="118" height="70" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="734.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Entretiens</text><text x="734.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">structurés</text><line x1="793" y1="145" x2="806" y2="145" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="806" y="110" width="118" height="70" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="865.0" y="137.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Décision +</text><text x="865.0" y="152.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">retours</text><rect x="330" y="230" width="300" height="64" rx="8" fill="#F8DEDB" stroke="#C0392B" stroke-width="1.2"/><text x="480.0" y="254.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#C0392B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Classement automatique des candidats</text><text x="480.0" y="269.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#C0392B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">par une IA sans contrôle humain</text><line x1="335" y1="235" x2="625" y2="290" stroke="#C0392B" stroke-width="3"/><text x="170" y="330.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle">Bleu : décision humaine · Vert pétrole : rédaction assistée · Or : logiciel</text></svg>