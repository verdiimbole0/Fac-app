<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d"><title id="t">Recrutement assisté : où l'IA aide, où l'humain décide</title><desc id="d">Étapes : besoin, fiche de poste (IA assiste), annonce (IA assiste), réception des candidatures (logiciel), présélection selon grille humaine, entretiens, décision et retour aux candidats. Le tri automatique sans contrôle humain est barré.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="940" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Recrutement : l'IA prépare, l'humain évalue et décide</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Aucune décision sur une personne n'est déléguée à une machine</text><rect x="20" y="110" width="118" height="70" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="79.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Besoin</text><text x="79.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">validé</text><line x1="138" y1="145" x2="151" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="151" y="110" width="118" height="70" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="210.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Fiche de</text><text x="210.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">poste</text><line x1="269" y1="145" x2="282" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="282" y="110" width="118" height="70" rx="8" fill="#167D73" stroke="#167D73" stroke-width="1.2"/><text x="341.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Annonce</text><text x="341.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">inclusive</text><line x1="400" y1="145" x2="413" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="413" y="110" width="118" height="70" rx="8" fill="#C7A34F" stroke="#C7A34F" stroke-width="1.2"/><text x="472.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Réception</text><text x="472.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">candidatures</text><line x1="531" y1="145" x2="544" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="544" y="110" width="118" height="70" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="603.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Présélection</text><text x="603.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">sur grille</text><line x1="662" y1="145" x2="675" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="675" y="110" width="118" height="70" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="734.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Entretiens</text><text x="734.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">structurés</text><line x1="793" y1="145" x2="806" y2="145" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="806" y="110" width="118" height="70" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="865.0" y="137.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Décision +</text><text x="865.0" y="152.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">retours</text><rect x="330" y="230" width="300" height="64" rx="8" fill="#F4DAD6" stroke="#A8413A" stroke-width="1.2"/><text x="480.0" y="254.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#A8413A" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Classement automatique des candidats</text><text x="480.0" y="269.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#A8413A" font-weight="bold" text-anchor="middle" dominant-baseline="middle">par une IA sans contrôle humain</text><line x1="335" y1="235" x2="625" y2="290" stroke="#A8413A" stroke-width="3"/><text x="170" y="330.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="11.5" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle">Bleu : décision humaine · Vert pétrole : rédaction assistée · Or : logiciel</text></svg>