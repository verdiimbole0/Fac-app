al" text-anchor="middle" dominant-baseline="middle">Indicateur :</text><text x="839.5" y="253.1" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#3F5BD8" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Incidence des</text><text x="839.5" y="266.9" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#3F5BD8" font-weight="normal" text-anchor="middle" dominant-baseline="middle">diarrhées (centre</text><text x="839.5" y="280.6" font-family="'Inter', Arial, sans-serif" font-size="11" fill="#3F5BD8" font-weight="normal" text-anchor="middle" dominant-baseline="middle">de santé)</text><text x="470" y="330.0" font-family="'Inter', Arial, sans-serif" font-size="11.5" fill="#6E6A85" font-weight="normal" text-anchor="middle" dominant-baseline="middle" font-style="italic">Plus on avance vers la droite, moins le résultat dépend du seul projet : l'attribution devient prudente.</text></svg>