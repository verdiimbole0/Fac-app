<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Entonnoir des tests analytiques assistés</title><desc id="d">Du fichier complet de 40 dépenses à neuf tests automatiques, 22 opérations signalées, 8 opérations prioritaires examinées par l'auditeur, puis 3 constats et une faiblesse de contrôle donnant lieu à recommandations.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">De la population aux constats</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">L'IA trie et signale ; l'auditeur examine et conclut</text><rect x="40.0" y="75" width="820" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="106.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Population : 40 dépenses, 31 890,50 UM (1er trimestre)</text><rect x="100.0" y="151" width="700" height="62" rx="8" fill="#E1E9FB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="174.2" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">9 tests automatiques : doublons · fournisseurs hors base · pièces ·</text><text x="450.0" y="189.8" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">auto-approbation · fractionnement · montants ronds · week-end · seuils · libellés</text><rect x="160.0" y="227" width="580" height="62" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="258.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">22 opérations signalées (dont de nombreux faux positifs)</text><rect x="230.0" y="303" width="440" height="62" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="334.0" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">8 opérations prioritaires examinées : pièces + entretiens</text><rect x="300.0" y="379" width="300" height="62" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="450.0" y="402.2" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">3 constats + 1 faiblesse de contrôle</text><text x="450.0" y="417.8" font-family="'Inter', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">→ recommandations</text></svg>