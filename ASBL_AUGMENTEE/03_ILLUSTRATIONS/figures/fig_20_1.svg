<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Gouvernance de l'IA dans l'ASBL</title><desc id="d">Conseil d'administration (politique IA, appétence au risque), direction (arbitrages, budget), comité ou référent IA (registre des outils, validation des usages, incidents), utilisateurs formés, avec audit périodique et amélioration continue.</desc><defs><marker id="ah241A6B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241A6B"/></marker><marker id="ah3F5BD8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F5BD8"/></marker><marker id="ah7B6CF0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B6CF0"/></marker><marker id="ah6E6A85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E6A85"/></marker><marker id="ahC0392B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="24" y="12" width="44" height="5" rx="2.5" fill="#7B6CF0"/><text x="24" y="34.0" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="18" fill="#241A6B" font-weight="800" text-anchor="start" dominant-baseline="middle">Une gouvernance de l'IA proportionnée</text><text x="24" y="52.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#6E6A85" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Pour une petite ASBL, le « comité » peut être une personne référente et un administrateur</text><rect x="60" y="80" width="220" height="70" rx="8" fill="#241A6B" stroke="#241A6B" stroke-width="1.2"/><text x="170.0" y="115.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Conseil d'administration</text><rect x="300" y="80" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="520.0" y="115.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Adopte la politique d'utilisation de l'IA · fixe les limites · reçoit un bilan annuel</text><line x1="170" y1="150" x2="170" y2="168" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="60" y="168" width="220" height="70" rx="8" fill="#3F5BD8" stroke="#241A6B" stroke-width="1.2"/><text x="170.0" y="203.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Direction exécutive</text><rect x="300" y="168" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="520.0" y="203.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Arbitre les priorités · alloue le budget · répond des incidents graves</text><line x1="170" y1="238" x2="170" y2="256" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="60" y="256" width="220" height="70" rx="8" fill="#E9E5FD" stroke="#241A6B" stroke-width="1.2"/><text x="170.0" y="291.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Référent·e / comité IA</text><rect x="300" y="256" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="520.0" y="291.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tient le registre des outils · valide les nouveaux usages · gère incidents et formation</text><line x1="170" y1="326" x2="170" y2="344" stroke="#241A6B" stroke-width="1.6" marker-end="url(#ah241A6B)"/><rect x="60" y="344" width="220" height="70" rx="8" fill="#F1EFFB" stroke="#241A6B" stroke-width="1.2"/><text x="170.0" y="379.0" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Utilisateurs formés</text><rect x="300" y="344" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#241A6B" stroke-width="1.2"/><text x="520.0" y="379.0" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Appliquent la politique · vérifient les sorties · signalent les problèmes</text><rect x="770" y="80" width="100" height="334" rx="8" fill="#E1E9FB" stroke="#3F5BD8" stroke-width="1.2"/><text x="820.0" y="194.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Audit</text><text x="820.0" y="209.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">périodique</text><text x="820.0" y="224.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle"></text><text x="820.0" y="239.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">+</text><text x="820.0" y="254.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle"></text><text x="820.0" y="269.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Amélio-</text><text x="820.0" y="284.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ration</text><text x="820.0" y="299.5" font-family="'Inter', Arial, sans-serif" font-size="12" fill="#241A6B" font-weight="bold" text-anchor="middle" dominant-baseline="middle">continue</text></svg>