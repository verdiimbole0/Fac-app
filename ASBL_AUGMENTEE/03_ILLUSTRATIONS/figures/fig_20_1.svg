<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d"><title id="t">Gouvernance de l'IA dans l'ASBL</title><desc id="d">Conseil d'administration (politique IA, appétence au risque), direction (arbitrages, budget), comité ou référent IA (registre des outils, validation des usages, incidents), utilisateurs formés, avec audit périodique et amélioration continue.</desc><defs><marker id="ah102849" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102849"/></marker><marker id="ah167D73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#167D73"/></marker><marker id="ahC7A34F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7A34F"/></marker><marker id="ah4A5A70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5A70"/></marker><marker id="ahA8413A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8413A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><rect x="0" y="0" width="900" height="6" fill="#C7A34F"/><text x="24" y="30.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="17" fill="#102849" font-weight="bold" text-anchor="start" dominant-baseline="middle">Une gouvernance de l'IA proportionnée</text><text x="24" y="52.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#4A5A70" font-weight="normal" text-anchor="start" dominant-baseline="middle" font-style="italic">Pour une petite ASBL, le « comité » peut être une personne référente et un administrateur</text><rect x="60" y="80" width="220" height="70" rx="8" fill="#102849" stroke="#102849" stroke-width="1.2"/><text x="170.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Conseil d'administration</text><rect x="300" y="80" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="520.0" y="115.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Adopte la politique d'utilisation de l'IA · fixe les limites · reçoit un bilan annuel</text><line x1="170" y1="150" x2="170" y2="168" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="60" y="168" width="220" height="70" rx="8" fill="#167D73" stroke="#102849" stroke-width="1.2"/><text x="170.0" y="203.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Direction exécutive</text><rect x="300" y="168" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="520.0" y="203.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Arbitre les priorités · alloue le budget · répond des incidents graves</text><line x1="170" y1="238" x2="170" y2="256" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="60" y="256" width="220" height="70" rx="8" fill="#F5ECD4" stroke="#102849" stroke-width="1.2"/><text x="170.0" y="291.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Référent·e / comité IA</text><rect x="300" y="256" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="520.0" y="291.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Tient le registre des outils · valide les nouveaux usages · gère incidents et formation</text><line x1="170" y1="326" x2="170" y2="344" stroke="#102849" stroke-width="1.6" marker-end="url(#ah102849)"/><rect x="60" y="344" width="220" height="70" rx="8" fill="#EAF0F5" stroke="#102849" stroke-width="1.2"/><text x="170.0" y="379.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="13" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Utilisateurs formés</text><rect x="300" y="344" width="440" height="70" rx="8" fill="#FFFFFF" stroke="#102849" stroke-width="1.2"/><text x="520.0" y="379.0" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Appliquent la politique · vérifient les sorties · signalent les problèmes</text><rect x="770" y="80" width="100" height="334" rx="8" fill="#D7ECE9" stroke="#167D73" stroke-width="1.2"/><text x="820.0" y="194.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Audit</text><text x="820.0" y="209.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">périodique</text><text x="820.0" y="224.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle"></text><text x="820.0" y="239.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">+</text><text x="820.0" y="254.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle"></text><text x="820.0" y="269.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Amélio-</text><text x="820.0" y="284.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ration</text><text x="820.0" y="299.5" font-family="'Source Sans 3', 'Source Sans Pro', 'Inter', Arial, sans-serif" font-size="12" fill="#102849" font-weight="bold" text-anchor="middle" dominant-baseline="middle">continue</text></svg>